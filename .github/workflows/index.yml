name: Bible d'étude (remplissage doux chaque nuit)

# Rédige les fiches de la Bible d'étude qui manquent encore (objectif : plus de
# 3 000 fiches), un peu chaque nuit pour ménager les crédits de l'IA.
#  - Automatique chaque nuit : 24 fiches (12 passages de 2).
#  - Lancement manuel (Run workflow) : 24 fiches de plus, si on veut accélérer.
on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch: {}

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Rédiger quelques fiches
        run: |
          for i in $(seq 1 12); do
            echo "→ Passage $i/12"
            OUT=$(curl -s --max-time 300 "${{ secrets.SITE_URL }}/api/cron/index?n=2" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || echo '{}')
            echo "$OUT"
            if echo "$OUT" | grep -q '"done":\[\]' && ! echo "$OUT" | grep -q '"errors"'; then
              echo "Bible d'étude complète."; break
            fi
            sleep 5
          done
