name: Mots bibliques (enrichissement quotidien)

# Ajoute quelques mots hebreu/grec/arameen par jour a la page Mots, en evitant
# les doublons. Deux passages par jour pour viser ~5-8 mots quotidiens.
on:
  schedule:
    - cron: '40 5 * * *'
    - cron: '40 17 * * *'
  workflow_dispatch: {}

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/words
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/cron/words?n=5" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
