name: Rappel de lecture (horaire)

# Vercel Hobby limite les crons a une fois par jour : /api/cron/reminders a
# besoin de tourner chaque heure pour respecter l'heure choisie par chaque
# lecteur. GitHub Actions fait ce declenchement gratuitement, en dehors de
# Vercel. Le fallback quotidien dans vercel.json reste actif en filet de
# securite si ce workflow est desactive.

on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/reminders
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
