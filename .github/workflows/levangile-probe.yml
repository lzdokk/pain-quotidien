name: Lexique levangile — sonde (manuel)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Westphal
        run: |
          UA="Mozilla/5.0 (PainDeVie; accord du proprietaire)"
          B=https://www.levangile.com/Dictionnaire-Biblique/
          curl -sL -m 20 -A "$UA" "${B}Liste-Definitions-Westphal.php" -o l.html
          echo "=== liens"; grep -o 'href="[^"]*"' l.html | sort | uniq -c | sort -rn | head -15
          echo "=== pages"; grep -io '[?&]page=[0-9]*\|[?&]lettre=[a-z]*' l.html | sort -u | head -40
          echo "=== defs"; grep -o 'href="[^"]*[Dd]efinition[^"]*"' l.html | head -8
          U=$(grep -o 'href="[^"]*[Dd]efinition[^"]*"' l.html | grep -iv liste | head -3 | tail -1 | sed 's/href="//;s/"$//'); echo "URL $U"
          case "$U" in http*) F="$U";; /*) F="https://www.levangile.com$U";; *) F="$B$U";; esac
          curl -sL -m 20 -A "$UA" "$F" -o d.html; echo "=== fiche $F"; sed -n '/<h1/,/<footer/p' d.html | grep -v '^\s*$' | head -70
