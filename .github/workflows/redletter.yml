name: Paroles de Jésus (red-letter, Évangiles)

# Tag les versets où Jésus parle, chapitre par chapitre, dans les 4 Évangiles.
# Quelques passages par jour jusqu'a couverture complete (~89 chapitres).
on:
  schedule:
    - cron: '36 5,17 * * *'
  workflow_dispatch: {}

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/redletter
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/cron/redletter?c=3" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
