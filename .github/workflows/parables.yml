name: Paraboles (catalogue Apprendre)

# Remplit le catalogue de paraboles theme par theme (vagues). Le palier
# gratuit Gemini limite a ~20 requetes/minute : on avance par petits paquets,
# plusieurs fois par jour, jusqu'a un catalogue complet.
# ARRÊTÉ (novembre 2026) : on garde 3 histoires par thème, plus aucune
# génération automatique. Lancement manuel seulement si on le décide.
on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/parables
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/cron/parables?batch=2" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
