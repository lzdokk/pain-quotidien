name: Push — Veillée du soir

# Envoi géré par cron-job.org (20:00 Europe/Paris, fiable + fuseau correct).
# Planification GitHub désactivée pour éviter les doublons ; garde le
# déclenchement manuel (Run workflow) pour les tests.
on:
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer la notification du soir
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/cron/notify?slot=soir" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
