name: Versets importants (~10% de la Bible)

# Parcourt la Bible chapitre par chapitre et etoile les versets les plus
# marquants (~un sur dix). Appelle /api/cron/famous-verses plusieurs fois par
# jour jusqu'a couverture complete des 1189 chapitres.
on:
  schedule:
    - cron: '42 */3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler /api/cron/famous-verses
        run: |
          curl -sf -X GET "${{ secrets.SITE_URL }}/api/cron/famous-verses?c=2" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
