 dev:"Le verset suivant écarte les trois façons dont on croit d'ordinaire appartenir à Dieu : ni du sang, donc pas par l'hérédité familiale ; ni de la volonté de la chair, donc pas par le désir humain ; ni de la volonté de l'homme, donc pas par une décision institutionnelle. Il reste une seule origine, Dieu lui-même.",
 versets:["Romains 8.15-16","Galates 4.4-7","1 Jean 3.1"]
},
'44-1-8':{
 mot:{terme:"martyres",langue:"grec",sens:"témoins, d'où vient le mot martyr"},
 quoi:"Jésus ne dit pas « vous serez mes avocats » ni « mes porte-parole », mais mes témoins. Un témoin ne plaide pas et n'argumente pas : il rapporte ce qu'il a vu.",
 parabole:"À la barre, on ne demande pas au témoin d'être convaincant, ni d'avoir un avis. On lui demande ce qu'il a vu, et c'est précisément parce qu'il ne fait que cela qu'on le croit.",
 dev:"Le verset donne aussi la table des matières du livre : Jérusalem (chapitres 1 à 7), la Judée et la Samarie (8 à 12), jusqu'aux extrémités de la terre (13 à 28). Et il place la puissance avant la mission, dans cet ordre, ce qui explique les dix jours d'attente qui suivent.",
 versets:["Luc 24.48-49","Actes 2.32","Actes 4.20"]
},
'44-1-14':{
 mot:{terme:"homothumadon",langue:"grec",sens:"d'un même élan, d'un seul cœur"},
 quoi:"Le mot revient dix fois dans les Actes et presque nulle part ailleurs. Il désignait à l'origine l'accord musical, plusieurs instruments produisant une seule harmonie. Il ne signifie pas que tout le monde pense pareil, mais que tout le monde tend au même but.",
 parabole:"Un orchestre n'est pas un ensemble de gens qui jouent la même note. C'est un ensemble de gens qui jouent des notes différentes vers le même accord.",
 dev:"Le détail social est remarquable pour l'époque : le texte mentionne les femmes, puis Marie, puis les frères de Jésus, ceux-là mêmes qui ne croyaient pas en lui de son vivant selon Jean 7.5. La résurrection a manifestement réglé la question dans sa propre famille.",
 versets:["Jean 7.5","Actes 2.46","Actes 4.24"]
}
};
</script>
<script>(function(){
'use strict';
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const URLAPI=window.URL||window.webkitURL;
const store={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},
  put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let tT; function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2400)}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const iso=d=>d.toISOString().slice(0,10);

/* ══════════════ ÉTAT ══════════════ */
const KEYS=Object.keys(DAYS).sort();
const TODAY=KEYS[KEYS.length-1];
let cur=store.get('pq-day'); if(!DAYS[cur]) cur=TODAY;
let curLesson=null, curFaq=null, faqCat='Tout';
const tickSvg='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5.5 5.5L20 7"/></svg>';

const fdate=k=>{const [y,m,d]=k.split('-').map(Number);
  const s=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(y,m-1,d));
  return s.charAt(0).toUpperCase()+s.slice(1)};
const isDone=k=>[0,1,2].every(i=>store.get('pq-step-'+k+'-'+i)==='1');

/* ══════════════ COMPTE ══════════════ */
function user(){return store.json('pq-user',null)}
function refreshAcct(){
  const u=user(), b=$('#acctBtn');
  if(u){ b.classList.add('avatar'); b.innerHTML=esc(u.prenom.slice(0,1).toUpperCase()); }
  else { b.classList.remove('avatar'); b.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20a7.5 7.5 0 0115 0"/></svg>'; }
}
function openAcct(){
  const u=user(), s=$('#acctSheet'), box=$('#acctIn');
  if(u){
    const notes=store.json('pq-notes',[]).length, hl=Object.keys(store.json('pq-hl',{})).length;
    const lec=CURSUS.reduce((a,m)=>a+m.l.filter(l=>store.get('pq-lecon-'+l.n)==='1').length,0);
    box.innerHTML='<div class="icon-btn avatar" style="width:56px;height:56px;font-size:22px;margin:0 auto 16px">'+esc(u.prenom[0].toUpperCase())+'</div>'
     +'<h3 style="font-size:21px">'+esc(u.prenom)+'</h3>'
     +'<p style="color:var(--ink-3);font-size:14px;margin-top:4px">'+esc(u.email)+'</p>'
     +'<div class="grid2" style="margin-top:22px">'
     +'<div class="mini"><strong>Carnet</strong><span>'+notes+' note'+(notes>1?'s':'')+', '+hl+' surlignage'+(hl>1?'s':'')+'</span></div>'
     +'<div class="mini"><strong>Cursus</strong><span>'+lec+' leçon'+(lec>1?'s':'')+' sur 35</span></div></div>'
     +'<div class="share-grid" style="margin-top:20px"><button class="btn" id="acctClose">Fermer</button>'
     +'<button class="btn" id="acctOut">Se déconnecter</button></div>'
     +'<p style="font-size:12.5px;color:var(--ink-4);margin-top:18px;line-height:1.6">En production, vos notes et surlignages sont synchronisés sur tous vos appareils.</p>';
    $('#acctOut').onclick=()=>{store.del('pq-user');refreshAcct();s.classList.remove('on');toast('Déconnecté.')};
  } else {
    box.innerHTML='<h3 style="font-size:22px;font-family:var(--serif);font-weight:600">Votre carnet de bord</h3>'
     +'<p style="color:var(--ink-2);font-size:15px;margin-top:10px;line-height:1.6">Retrouvez vos notes, vos surlignages et votre progression sur tous vos appareils.</p>'
     +'<div class="share-grid" style="margin-top:24px;grid-template-columns:1fr">'
     +'<button class="btn primary" id="gGoogle">Continuer avec Google</button>'
     +'<button class="btn" id="gMail">Continuer par e-mail</button>'
     +'<button class="btn" id="acctClose" style="border:0">Plus tard</button></div>'
     +'<p style="font-size:12.5px;color:var(--ink-4);margin-top:18px;line-height:1.6">Aucune donnée revendue, aucun traceur publicitaire. Vous pouvez tout supprimer en un clic.</p>';
    const login=()=>{store.put('pq-user',{prenom:'Mickaël',email:'lzdokk@gmail.com'});refreshAcct();s.classList.remove('on');
      toast('Connecté. Carnet synchronisé.');renderLire()};
    $('#gGoogle').onclick=login; $('#gMail').onclick=login;
  }
  $('#acctClose').onclick=()=>s.classList.remove('on');
  s.classList.add('on');
}
$('#acctBtn').addEventListener('click',openAcct);
$('#acctSheet').addEventListener('click',e=>{if(e.target.id==='acctSheet') e.currentTarget.classList.remove('on')});

/* ══════════════ BARRE DE JOURS ══════════════ */
function renderWeek(){
  const w=$('#week'); w.innerHTML='';
  KEYS.forEach(k=>{
    const [y,m,d]=k.split('-').map(Number), dt=new Date(y,m-1,d);
    const dw=new Intl.DateTimeFormat('fr-FR',{weekday:'short'}).format(dt).replace('.','');
    const b=document.createElement('button');
    b.className='day'; b.setAttribute('aria-current',String(k===cur));
    b.innerHTML='<span class="dw">'+dw+'</span><span class="dn">'+d+'</span>'+(isDone(k)?'<span class="done-dot"></span>':'');
    b.addEventListener('click',()=>go(k)); w.appendChild(b);
  });
  $('#prevDay').disabled=KEYS.indexOf(cur)<=0;
  $('#nextDay').disabled=KEYS.indexOf(cur)>=KEYS.length-1;
  const n=KEYS.filter(isDone).length;
  $('#streak').textContent=n+' jour'+(n>1?'s':'')+' complété'+(n>1?'s':'');
}
$('#prevDay').onclick=()=>{const i=KEYS.indexOf(cur); if(i>0) go(KEYS[i-1])};
$('#nextDay').onclick=()=>{const i=KEYS.indexOf(cur); if(i<KEYS.length-1) go(KEYS[i+1])};
function go(k){cur=k;store.set('pq-day',k);renderWeek();renderMatin();renderTemoigner();renderSoir();scrollTop()}
function scrollTop(){try{window.scrollTo({top:0,behavior:'smooth'})}catch(e){}}

/* ══════════════ MATIN ══════════════ */
function renderMatin(){
  const D=DAYS[cur], past=cur!==TODAY;
  let h='<header class="hero"><div class="eyebrow">Le pain du matin</div><div class="date">'+fdate(cur)+'</div>'
   +'<h1>'+D.titre+'</h1><p class="lede">'+D.lede+'</p>'
   +'<div class="liturgy"><span class="dot"></span> Plan de lecture · Jour '+D.jour+' · Bible Segond'+(past?' · archive':'')+'</div></header>';
  h+='<div class="prayer opening"><span class="kicker">Prière d’ouverture</span><p>'+D.ouverture+'</p></div>';
  h+='<div class="card pad"><span class="kicker">Le centre du message</span>'
   +'<p style="font-family:var(--serif);font-size:21px;line-height:1.55;letter-spacing:-.015em;color:var(--ink)">'+D.centre+'</p></div>';
  h+='<h2 class="sect">Les lectures du jour</h2><p class="sub">Touchez une lecture pour déplier le texte intégral et son résumé.</p><div class="card">';
  D.lectures.forEach((L,i)=>{
    h+='<article class="rd'+(i===0?' open':'')+'">'
     +'<button class="rd-toggle" data-rd="'+i+'"><span class="num">'+(i+1)+'</span><span>'
     +'<span class="rd-ref">'+L.ref+' \u00b7 SEGOND</span><span class="rd-title">'+L.titre+'</span>'
     +'<span class="rd-teaser">'+L.tag+' \u00b7 '+L.v.length+' versets</span></span>'
     +'<svg class="chev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button>'
     +'<div class="rd-body"><div class="scripture">'+L.v.map(v=>'<p><span class="v">'+v[0]+'</span>'+v[1]+'</p>').join('')+'</div>';
    if(L.canon) h+='<div class="note-canon"><b>Note de canon.</b> Le calendrier de lectures proposait ici un texte deutérocanonique, absent du canon protestant de 66 livres. Il a été remplacé par un passage de même thème.</div>';
    h+='<div class="rd-sum"><strong>Le résumé</strong><p>'+L.résumé+'</p><span class="tag">'+L.tag+'</span></div></div></article>';
  });
  h+='</div><div class="card verse"><blockquote>'+D.verset.t+'</blockquote><cite>'+D.verset.r+'</cite></div>';
  h+='<h2 class="sect">Le pain quotidien</h2><p class="sub">Ce que ce texte vient dire à votre journée.</p>'
   +'<div class="card pad pq"><p class="lead">'+D.pain.lead+'</p>'
   +'<h3>Ce que dit le texte</h3>'+D.pain.dit.map(p=>'<p>'+p+'</p>').join('')
   +'<h3>Ce que ça touche en nous</h3>'+D.pain.touche.map(p=>'<p>'+p+'</p>').join('')
   +'<h3>Concrètement, aujourd’hui</h3><ul class="steps">'
   +D.actions.map((a,i)=>'<li><button class="tick" data-step="'+i+'" aria-pressed="false" aria-label="Fait">'+tickSvg+'</button>'
     +'<span class="st-txt"><b>'+a[0]+'</b> '+a[1]+'</span></li>').join('')+'</ul></div>';
  h+='<div class="prayer"><span class="kicker">Prière de fermeture</span><p>'+D.fermeture+'</p></div>';
  $('#p-matin').innerHTML=h;
  $$('#p-matin .rd-toggle').forEach(b=>b.onclick=()=>b.closest('.rd').classList.toggle('open'));
  $$('#p-matin .tick').forEach(b=>{
    const key='pq-step-'+cur+'-'+b.dataset.step;
    if(store.get(key)==='1'){b.setAttribute('aria-pressed','true');b.closest('li').classList.add('done')}
    b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';
      b.setAttribute('aria-pressed',String(on));b.closest('li').classList.toggle('done',on);
      store.set(key,on?'1':'0');renderWeek();if(on)toast(isDone(cur)?'Journée complétée. Amen.':'Amen.')};
  });
}

/* ══════════════ TÉMOIGNER ══════════════ */
function renderTemoigner(){
  const D=DAYS[cur], T=D.temoigner;
  let h='<header class="hero"><div class="eyebrow">Témoigner · chaque jour</div>'
   +'<h1>Ce texte est<br>pour quelqu’un<br>d’autre aussi</h1>'
   +'<p class="lede">Pas une technique. Une phrase juste, au bon moment, à la bonne personne.</p></header>';
  h+='<div class="card pad"><span class="kicker">Le fil du jour</span><h3 style="margin-top:6px">Ce que le texte d’aujourd’hui vous donne à dire</h3>'
   +T.fil.map(p=>'<p style="margin-top:12px">'+p+'</p>').join('')+'</div>';
  h+='<div class="card pad"><span class="kicker">Trois amorces de conversation</span><h3 style="margin-top:6px">Touchez pour copier</h3>'
   +T.amorces.map(a=>'<div class="opener">'+a+'</div>').join('')+'</div>';
  h+='<div class="card pad"><span class="kicker">L’Évangile en quatre mouvements</span><h3 style="margin-top:6px">À savoir par cœur, à sortir en deux minutes</h3><div class="gospel">'
   +[["Dieu","Il n’est pas une force floue. Il est une personne, il crée, et il crée bon. Nous sommes voulus, pas produits par accident.","Genèse 1.27 · Psaume 139.13-14"],
     ["La rupture","Quelque chose est cassé, dans le monde et en nous. Ce n’est pas un défaut d’éducation, c’est une séparation. Et personne ne s’en sort par ses propres moyens.","Romains 3.23 · Ésaïe 59.2"],
     ["La croix","Dieu n’a pas envoyé un mode d’emploi, il est venu lui-même. Jésus prend la place, meurt, et ressuscite. La dette n’est pas allégée : elle est payée.","Romains 5.8 · 1 Corinthiens 15.3-4"],
     ["La réponse","Rien à mériter, tout à recevoir. Se détourner de ce qui nous tenait, faire confiance à Christ. C’est là que commence la vie nouvelle, et l’entrée dans la famille.","Éphésiens 2.8-9 · Jean 1.12"]]
    .map((m,i)=>'<div class="mv"><span class="mv-n">'+(i+1)+'</span><div><h4>'+m[0]+'</h4><p>'+m[1]+'</p><span class="vv">'+m[2]+'</span></div></div>').join('')
   +'</div></div>';
  h+='<div class="card pad"><span class="kicker">L’objection du jour</span><h3 style="margin-top:6px">'+T.objection.q+'</h3>'
   +T.objection.r.map(p=>'<p style="margin-top:12px">'+p+'</p>').join('')+'</div>';
  h+='<div class="card pad"><span class="kicker">Une personne, un nom</span><h3 style="margin-top:6px">Priez pour quelqu’un de précis</h3>'
   +'<p style="margin-top:10px">L’évangélisation devient concrète le jour où elle a un prénom. Écrivez-en un ici, le site s’en souvient et vous le rappelle chaque matin.</p>'
   +'<input class="field" id="prayName" type="text" placeholder="Le prénom de la personne pour qui vous priez" autocomplete="off" style="margin-top:12px">'
   +'<div class="prayer" style="margin-top:18px"><span class="kicker">Prière d’intercession</span><p id="prayLine"></p></div></div>';
  h+='<h2 class="sect">Partager le pain du jour</h2><p class="sub">Un lien, un message prêt, une image pour les stories.</p>'
   +'<div class="card pad"><div class="share-grid">'
   +'<button class="btn primary" id="bShare">Partager</button><button class="btn" id="bCopy">Copier le texte</button>'
   +'<button class="btn" id="bWa">WhatsApp</button><button class="btn" id="bImg">Image story</button></div>'
   +'<div class="preview" id="shareTxt"></div></div>';
  $('#p-temoigner').innerHTML=h;

  $$('#p-temoigner .opener').forEach(o=>o.onclick=()=>copy(o.textContent.trim(),'Amorce copiée.'));
  const BASE="Seigneur, je te confie NOM. Tu le connais mieux que moi. Ôte ce qui l’empêche de voir, mets sur sa route ceux qu’il faut, et prépare le moment. Donne-moi les mots justes et la patience de me taire quand il le faut. Que ta bonté le conduise à la repentance. Au nom de Jésus, amen.";
  const ni=$('#prayName'), pl=$('#prayLine');
  const rp=()=>{pl.textContent=BASE.replace('NOM',(ni.value||'').trim()||'cette personne')};
  ni.value=store.get('pq-name')||''; rp();
  ni.oninput=()=>{store.set('pq-name',ni.value);rp()};

  const TEXT=D.verset.plain+"\n"+D.verset.ref+" (Segond)\n\n"+D.titre.replace(/<br>/g,' ')+"\n"+D.lede+"\n\nLe pain quotidien du jour :\n"+location.href.split('#')[0];
  $('#shareTxt').textContent=TEXT;
  $('#bShare').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Le Pain Quotidien',text:TEXT})}catch(e){}}else copy(TEXT,'Texte copié.')};
  $('#bCopy').onclick=()=>copy(TEXT,'Texte copié.');
  $('#bWa').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(TEXT),'_blank','noopener');
  $('#bImg').onclick=makeStory;
}

/* ══════════════ SOIR ══════════════ */
function renderSoir(){
  const D=DAYS[cur].soir;
  let h='<header class="hero"><div class="eyebrow">La veillée du soir</div><div class="date">'+fdate(cur)+' · 21h00</div>'
   +'<h1>Poser<br>la journée</h1><p class="lede">Cinq minutes avant de dormir. Un verset, un silence, une relecture, une paix.</p></header>';
  h+='<div class="card verse"><div class="breathe"><div class="orb"><span>Respirez</span></div></div>'

  h+='<div class="card pad pq"><span class="kicker">Méditation du soir</span><h3 style="margin-top:6px">'+D.titre+'</h3>'
   +D.med.map(p=>'<p>'+p+'</p>').join('')+'</div>';
  h+='<div class="card pad"><span class="kicker">Relecture, trois questions</span><ul class="steps">'

/* ══════════════ LIRE : parcours + lecteur + carnet ══════════════ */
let rd={trad:store.get('pq-trad')||'FRLSG', livre:+(store.get('pq-livre')||44), chap:+(store.get('pq-chap')||1)};
let selVerse=null;

function planState(){return store.json('pq-plan',{id:'fondement',jour:22})}
function planInfo(){
  const st=planState(), P=PARCOURS.find(p=>p.id===st.id)||PARCOURS[0];
  let n=st.jour, e=0, ch=1;
  for(let i=0;i<P.etapes.length;i++){
    const c=P.etapes[i].ch||1;
    if(n<=c){e=i;ch=n;break}
    n-=c; e=i+1; ch=1;
  }
  if(e>=P.etapes.length){e=P.etapes.length-1;ch=P.etapes[e].ch||1}
  return {P:P,st:st,etape:P.etapes[e],ei:e,ch:ch};
}
function lastRead(){return store.get('pq-lastread')||''}

function renderLire(){
  const pi=planInfo(), u=user();
  const total=pi.P.duree, pct=total?Math.min(100,Math.round(pi.st.jour/total*100)):0;
  const oublie = lastRead() && lastRead()!==iso(new Date());
  let h='<header class="hero"><div class="eyebrow">Lire la Bible</div>'
   +'<h1>Un chapitre<br>par jour</h1>'
   +'<p class="lede">Un parcours qui commence là où il faut commencer, et un carnet qui garde tout ce que vous notez.</p></header>';

  if(oublie) h+='<div class="banner"><span style="font-size:18px">🔔</span><div><b>Vous n’avez pas encore lu aujourd’hui.</b> Votre dernière lecture remonte au '+esc(lastRead())+'. Un chapitre prend sept minutes.</div></div>';

  /* lecture du jour */
  h+='<div class="card"><div class="today-read"><span class="kicker">Votre lecture du jour</span>'
   +'<div class="big-ref">'+esc(pi.etape.nom)+' '+pi.ch+'</div>'
   +'<p style="color:var(--ink-2);font-size:15.5px">Jour '+pi.st.jour+' sur '+total+' · Étape '+(pi.ei+1)+' sur '+pi.P.etapes.length+', '+esc(pi.etape.titre)+'</p>'
   +'<div class="progress-wrap"><div class="bar"><i style="width:'+pct+'%"></i></div><span class="pct">'+pct+' %</span></div>'
   +'<div class="share-grid" style="margin-top:20px"><button class="btn primary" id="openToday">Ouvrir la lecture</button>'
   +'<button class="btn" id="doneToday">J’ai lu, chapitre suivant</button></div></div></div>';

  /* parcours */
  h+='<h2 class="sect">Votre parcours</h2><p class="sub">Quatre chemins. Prenez Le Fondement si vous débutez.</p>'
   +'<div class="card pad">'
   +[['progressif','Progressif, pour comprendre'],['integral','Intégral, pour tout lire'],['libre','Libre, à votre main']]
     .map(g=>'<div class="grp" style="padding:14px 0 4px">'+g[1]+'</div><div class="chips" style="margin:0">'
       +PARCOURS.filter(p=>p.style===g[0]).map(p=>'<button class="chip" aria-selected="'+(p.id===pi.st.id)+'" data-parc="'+p.id+'">'
         +esc(p.nom)+(p.duree?' \u00b7 '+p.duree+' j':'')+'</button>').join('')+'</div>').join('')

   +'<select class="field" id="rLivre">'+LIVRES.map((b,i)=>i?'<option value="'+i+'"'+(i===rd.livre?' selected':'')+'>'+esc(b[0])+'</option>':'').join('')+'</select>'
   +'<select class="field" id="rChap">'+Array.from({length:L[1]},(_,i)=>'<option value="'+(i+1)+'"'+(i+1===rd.chap?' selected':'')+'>'+(i+1)+'</option>').join('')+'</select>'
   +'</div><p style="font-size:12.5px;color:var(--ink-4);margin-top:10px;line-height:1.55">'+esc((BIBLES.find(b=>b.code===rd.trad)||{}).note||'')+'</p></div>'
   +'<div class="chap-nav"><button class="nav-day" id="cPrev" aria-label="Chapitre précédent"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>'
   +'<span class="chap-title" id="chapTitle" style="cursor:pointer">'+esc(L[0])+' '+rd.chap+' <span style="font-size:13px;color:var(--accent);vertical-align:3px">\u24d8</span></span>'

   +'<div class="vlist" id="vlist"><p class="empty">Chargement…</p></div>'
   +'<div class="vbar" id="vbar"></div></div>';

  /* carnet */

   +'<div class="card pad">';
  if(!notes.length && !hlList.length){
    h+='<p class="empty">Rien pour l’instant. Ouvrez un chapitre, touchez un verset, choisissez une couleur ou écrivez une note. Tout se retrouve ici.</p>';

      +'<div class="etext">'+esc(n.texte)+'</div><div class="enote">'+esc(n.note)+'</div>'

        +'<button class="edel" data-delhl="'+x.k+'">Retirer le surlignage</button></div>';

  }
  h+='</div>';

  if(!u) h+='<div class="banner"><span style="font-size:18px">☁︎</span><div><b>Vos notes sont enregistrées sur cet appareil seulement.</b> Créez un compte pour les retrouver partout et ne rien perdre.</div></div>';

  h+='<div class="foot">Texte biblique : <strong>Bible Segond 1910</strong>, domaine public · '

   +'<span style="opacity:.7">Le Pain Quotidien, prototype de design, juillet 2026</span></div>';

function bindLire(){
  $$('#p-lire [data-parc]').forEach(c=>c.onclick=()=>{store.put('pq-plan',{id:c.dataset.parc,jour:1});renderLire();scrollTop()});
  $('#openToday').onclick=()=>{const pi=planInfo();rd.livre=pi.etape.livre;rd.chap=pi.ch;saveRd();renderLire();
    setTimeout(()=>{const el=$('#p-lire .chap-nav');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},120)};
  $('#doneToday').onclick=()=>{const st=planState();st.jour++;store.put('pq-plan',st);
    store.set('pq-lastread',iso(new Date()));toast('Chapitre validé. À demain.');renderLire()};
  $('#rTrad').onchange=e=>{rd.trad=e.target.value;saveRd();renderLire()};
  $('#rLivre').onchange=e=>{rd.livre=+e.target.value;rd.chap=1;saveRd();renderLire()};
  $('#rChap').onchange=e=>{rd.chap=+e.target.value;saveRd();renderLire()};
  $('#cPrev').onclick=()=>{if(rd.chap>1){rd.chap--;saveRd();renderLire()}else if(rd.livre>1){rd.livre--;rd.chap=LIVRES[rd.livre][1];saveRd();renderLire()}};
  $('#cNext').onclick=()=>{if(rd.chap<LIVRES[rd.livre][1]){rd.chap++;saveRd();renderLire()}else if(rd.livre<66){rd.livre++;rd.chap=1;saveRd();renderLire()}};
  const ct=$('#chapTitle'); if(ct) ct.onclick=explainChapter;
  $('#rSearch').onkeydown=e=>{if(e.key==='Enter'){doSearch(e.target.value);}};
  $('#bRead').onclick=()=>{if(!('Notification' in window))return toast('Non supporté par ce navigateur.');
    Notification.requestPermission().then(p=>toast(p==='granted'?'Rappel activé à 20 h.':'Rappel non activé.'))};
  $$('#p-lire [data-delnote]').forEach(b=>b.onclick=()=>{const a=store.json('pq-notes',[]);a.splice(+b.dataset.delnote,1);store.put('pq-notes',a);renderLire()});
  $$('#p-lire [data-delhl]').forEach(b=>b.onclick=()=>{const o=store.json('pq-hl',{});delete o[b.dataset.delhl];store.put('pq-hl',o);renderLire()});
}
function saveRd(){store.set('pq-trad',rd.trad);store.set('pq-livre',rd.livre);store.set('pq-chap',rd.chap)}

function doSearch(q){
  q=(q||'').trim(); if(!q) return;
  const m=q.match(/^(\d?\s?[^\d]+?)\s*(\d+)?\s*$/i); if(!m) return toast('Référence non reconnue.');
  const nom=m[1].trim().toLowerCase().replace(/\./g,''), ch=+(m[2]||1);
  let best=-1;
  for(let i=1;i<LIVRES.length;i++){
    const n=LIVRES[i][0].toLowerCase();
    if(n.startsWith(nom)||n.replace(/[éèê]/g,'e').startsWith(nom.replace(/[éèê]/g,'e'))){best=i;break}
  }
  if(best<0) return toast('Livre introuvable.');
  rd.livre=best; rd.chap=Math.min(Math.max(1,ch),LIVRES[best][1]); saveRd(); renderLire();
}

async function loadChapter(){
  const el=$('#vlist'); if(!el) return;
  const key=rd.livre+'-'+rd.chap;
  let verses=null;
  try{
    const r=await fetch('https://bolls.life/get-chapter/'+rd.trad+'/'+rd.livre+'/'+rd.chap+'/');
    if(r.ok){const j=await r.json(); if(j&&j.length) verses=j.map(v=>[v.verse,String(v.text).replace(/<[^>]+>/g,'').trim()])}
  }catch(e){}
  if(!verses && CHAPITRES[key]) verses=CHAPITRES[key];
  if(!verses){
    el.innerHTML='<p class="empty">Ce chapitre n’a pas pu être chargé hors ligne. Le prototype embarque Jean 1 et Actes 1 ; en production, tout le texte vient de la base.</p>';
    return;
  }
  const hls=store.json('pq-hl',{}), notes=store.json('pq-notes',[]);
  const hasNote={}; notes.forEach(n=>hasNote[n.k]=1);
  el.innerHTML=verses.map(v=>{
    const k=rd.livre+'-'+rd.chap+'-'+v[0], c=hls[k];
    return '<span class="vs'+(c?' h'+c:'')+'" data-v="'+v[0]+'"><span class="vn">'+v[0]+'</span>'+esc(v[1])
      +(hasNote[k]?'<span class="noteflag">note</span>':'')+'</span>';
  }).join(' ');
  $$('#vlist .vs').forEach(s=>s.onclick=()=>selectVerse(+s.dataset.v,verses));
}

function selectVerse(n,verses){
  selVerse=n;
  $$('#vlist .vs').forEach(s=>s.classList.toggle('sel',+s.dataset.v===n));
  const k=rd.livre+'-'+rd.chap+'-'+n, ref=LIVRES[rd.livre][0]+' '+rd.chap+'.'+n;
  const txt=(verses.find(v=>v[0]===n)||[0,''])[1];
  const notes=store.json('pq-notes',[]); const ex=notes.find(x=>x.k===k);
  const bar=$('#vbar');
  bar.innerHTML='<div class="vref">'+esc(ref)+'</div><div class="vbar-row">'
   +'<span class="swatch s1" data-c="1"></span><span class="swatch s2" data-c="2"></span>'
   +'<span class="swatch s3" data-c="3"></span><span class="swatch s4" data-c="4"></span><span class="swatch s0" data-c="0"></span>'
   +'<button class="btn sm" id="vNote" style="margin-left:auto">'+(ex?'Modifier la note':'Ajouter une note')+'</button>'
   +'<button class="btn sm" id="vExpl">Expliquer</button>'
   +'<button class="btn sm" id="vAsk">Poser une question</button>'
   +'<button class="btn sm" id="vCopy">Copier</button></div>'
   +'<div id="noteZone"></div>';
  bar.classList.add('on');
  $$('#vbar .swatch').forEach(s=>s.onclick=()=>{
    const o=store.json('pq-hl',{}); const c=+s.dataset.c;
    if(c) o[k]=c; else delete o[k];
    store.put('pq-hl',o); bar.classList.remove('on');
    renderLire();
    toast(c?'Verset surligné, ajouté au carnet.':'Surlignage retiré.');
  });
  $('#vNote').onclick=()=>{
    $('#noteZone').innerHTML='<textarea class="field" id="nTxt" placeholder="Ce que ce verset vous dit, une question, un lien avec votre vie…" style="margin-top:12px">'+esc(ex?ex.note:'')+'</textarea>'
     +'<div class="share-grid" style="margin-top:10px"><button class="btn primary" id="nSave">Enregistrer dans mon carnet</button></div>';
    $('#nTxt').focus();
    $('#nSave').onclick=()=>{
      const v=$('#nTxt').value.trim(); const a=store.json('pq-notes',[]);
      const i=a.findIndex(x=>x.k===k);
      if(!v){ if(i>=0)a.splice(i,1); } else {
        const rec={k:k,ref:ref,texte:txt,note:v,date:iso(new Date())};
        if(i>=0)a[i]=rec; else a.push(rec);
      }
      store.put('pq-notes',a); bar.classList.remove('on'); renderLire(); toast('Enregistré dans le carnet.');
    };
  };
  $('#vExpl').onclick=()=>{ bar.classList.remove('on'); explainVerse(n,ref,txt); };
  $('#vAsk').onclick=()=>{ bar.classList.remove('on'); gotoTab('questions'); askAbout(ref,txt); };
  $('#vCopy').onclick=()=>copy('« '+txt+' » '+ref+' (Segond)','Verset copié.');
}

/* ══════════════ QUESTIONS : base + chatbot ══════════════ */
const QUOTA=8;
function quotaKey(){return 'pq-quota-'+iso(new Date())}
function quotaLeft(){return QUOTA-(+(store.get(quotaKey())||0))}
function quotaUse(){store.set(quotaKey(),String(+(store.get(quotaKey())||0)+1))}

function renderQuestions(){
  const cats=['Tout'].concat(FAQ.map(f=>f.cat).filter((c,i,a)=>a.indexOf(c)===i));
  let h='<header class="hero"><div class="eyebrow">Questions</div>'
   +'<h1>Les questions<br>que tout le monde<br>se pose</h1>'
   +'<p class="lede">Vingt réponses déjà rédigées, chacune avec une parabole. Et si la vôtre n’y est pas, posez-la.</p></header>';

  if(curFaq){
    const f=FAQ.find(x=>x.id===curFaq);
    h+='<button class="back" id="faqBack">‹ Toutes les questions</button>'
     +'<div class="card pad pq"><span class="kicker">'+esc(f.cat)+'</span>'
     +'<h3 style="font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.25;margin:6px 0 16px">'+esc(f.q)+'</h3>'
     +'<div class="mini"><strong>En une phrase</strong><span>'+esc(f.court)+'</span></div>'
     +'<h3 style="margin-top:28px">La parabole</h3><p class="parable">'+esc(f.parabole)+'</p>'
     +'<h3>Pour aller plus loin</h3>'+f.dev.map(p=>'<p>'+p+'</p>').join('')
     +'<div class="keyv"><strong>À lire dans la Bible</strong><p style="font-family:var(--sans);font-size:15px">'
     +f.versets.map(v=>'<span class="ref-inline">'+esc(v)+'</span>').join(' &nbsp;·&nbsp; ')+'</p></div>'
     +'<div class="share-grid" style="margin-top:22px"><button class="btn" id="faqCopy">Copier cette réponse</button>'
     +'<button class="btn" id="faqAsk">Approfondir avec l’assistant</button></div></div>';
    $('#p-questions').innerHTML=h;
    $('#faqBack').onclick=()=>{curFaq=null;renderQuestions();scrollTop()};
    $('#faqCopy').onclick=()=>copy(f.q+'\n\n'+f.court+'\n\n'+f.parabole+'\n\n'+f.dev.join('\n\n').replace(/<[^>]+>/g,''),'Réponse copiée.');
    $('#faqAsk').onclick=()=>{curFaq=null;renderQuestions();setTimeout(()=>askAbout(null,null,f.q),100)};
    return;
  }

  h+='<div class="card pad"><input class="field" id="faqSearch" type="search" placeholder="Chercher une question, par exemple « souffrance » ou « enfer »" autocomplete="off">'
   +'<div class="chips" style="margin-top:16px">'
   +cats.map(c=>'<button class="chip" aria-selected="'+(c===faqCat)+'" data-cat="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div></div>';

  const list=FAQ.filter(f=>faqCat==='Tout'||f.cat===faqCat);
  h+='<div class="card">'+list.map((f,i)=>'<div class="faq-item"><button class="faq-q" data-faq="'+f.id+'">'
   +'<span class="qi">'+(i+1)+'</span><span><span class="qt">'+esc(f.q)+'</span><span class="qc">'+esc(f.cat)+'</span></span></button></div>').join('')+'</div>';

  const left=quotaLeft();
  h+='<h2 class="sect">L’assistant</h2><p class="sub">Pour une question qui n’est pas dans la base, ou pour approfondir un verset précis.</p>'
   +'<div class="chatbox"><div class="quota"><span class="qd">'
   +Array.from({length:QUOTA},(_,i)=>'<i class="'+(i<left?'':'off')+'"></i>').join('')
   +'</span><span>'+left+' question'+(left>1?'s':'')+' restante'+(left>1?'s':'')+' aujourd’hui</span></div>'
   +'<div id="chatLog"></div>'
   +'<textarea class="field" id="chatIn" placeholder="Votre question. Par exemple : je lis Jean 1.14, que veut dire « la Parole a été faite chair » ?" style="margin-top:14px"></textarea>'
   +'<div class="share-grid" style="margin-top:10px;grid-template-columns:1fr auto"><button class="btn primary" id="chatSend">Envoyer</button></div>'
   +'<p style="font-size:12.5px;color:var(--ink-4);margin-top:14px;line-height:1.6">La base de questions est gratuite et illimitée. L’assistant n’est appelé que si aucune réponse ne correspond, ce qui garde le coût très bas.</p></div>';

  h+='<div class="foot"><span style="opacity:.7">Réponses rédigées et relues, orientation protestante évangélique, présentation honnête des positions divergentes.</span></div>';
  $('#p-questions').innerHTML=h;

  $$('#p-questions [data-cat]').forEach(c=>c.onclick=()=>{faqCat=c.dataset.cat;renderQuestions()});
  $$('#p-questions [data-faq]').forEach(b=>b.onclick=()=>{curFaq=+b.dataset.faq;renderQuestions();scrollTop()});
  $('#faqSearch').oninput=e=>{
    const q=e.target.value.toLowerCase().trim();
    $$('#p-questions .faq-item').forEach((it,i)=>{
      const f=FAQ.filter(f=>faqCat==='Tout'||f.cat===faqCat)[i];
      it.style.display=(!q||(f.q+' '+f.cat+' '+f.court).toLowerCase().includes(q))?'':'none';
    });
  };
  $('#chatSend').onclick=()=>sendChat($('#chatIn').value);
  restoreChat();
}

function restoreChat(){
  const log=store.json('pq-chat',[]);
  const el=$('#chatLog'); if(!el) return;
  el.innerHTML=log.map(m=>renderMsg(m)).join('');
}
function renderMsg(m){
  if(m.r==='me') return '<div class="msg me">'+esc(m.t)+'</div>';
  return '<div class="msg bot">'+m.t+(m.src?'<span class="src">'+esc(m.src)+'</span>':'')+'</div>';
}
function pushMsg(m){
  const log=store.json('pq-chat',[]); log.push(m);
  if(log.length>20) log.splice(0,log.length-20);
  store.put('pq-chat',log);
  const el=$('#chatLog'); if(el) el.insertAdjacentHTML('beforeend',renderMsg(m));
}

function matchFaq(q){
  const s=q.toLowerCase();
  const words=s.split(/\W+/).filter(w=>w.length>3);
  let best=null,score=0;
  FAQ.forEach(f=>{
    const hay=(f.q+' '+f.cat+' '+f.court).toLowerCase();
    let sc=0; words.forEach(w=>{if(hay.includes(w))sc++});
    if(sc>score){score=sc;best=f}
  });
  return score>=2?best:null;
}

function sendChat(q){
  q=(q||'').trim(); if(!q) return;
  const ta=$('#chatIn'); if(ta) ta.value='';
  pushMsg({r:'me',t:q});
  const f=matchFaq(q);
  if(f){
    pushMsg({r:'bot',t:'<b>'+esc(f.q)+'</b><br><br>'+esc(f.court)+'<div class="par">'+esc(f.parabole)+'</div>'
      +f.dev[0]+'<br><br><span class="ref-inline">'+f.versets.join(' · ')+'</span>',src:'Base de questions, réponse gratuite'});
    setTimeout(()=>{curFaq=f.id;},0);
    toast('Trouvé dans la base, aucun crédit consommé.');
    return;
  }
  if(quotaLeft()<=0){ pushMsg({r:'bot',t:'Vous avez utilisé vos '+QUOTA+' questions du jour. La base de questions reste accessible sans limite, et le compteur repart demain matin.',src:'Quota atteint'}); return; }
  quotaUse();
  pushMsg({r:'bot',t:'<i>Réflexion en cours…</i>',src:'Assistant'});
  setTimeout(()=>{
    const el=$('#chatLog'); if(el&&el.lastElementChild) el.lastElementChild.remove();
    pushMsg({r:'bot',t:'En production, cette question part vers l’API Claude avec le contexte suivant : le passage que vous lisez, votre parcours en cours, et la consigne de répondre en théologien protestant, avec une parabole du quotidien avant l’explication, puis deux ou trois références bibliques.'
      +'<div class="par">La réponse type suit toujours la même forme : une image concrète, ce que dit le texte, ce que ça change, les versets à lire.</div>'
      +'Ce prototype ne consomme évidemment aucun crédit.',src:'Assistant · 1 question décomptée'});
    renderQuotaDots();
  },900);
}
function renderQuotaDots(){
  const el=$('#p-questions .quota'); if(!el) return;
  const left=quotaLeft();
  el.innerHTML='<span class="qd">'+Array.from({length:QUOTA},(_,i)=>'<i class="'+(i<left?'':'off')+'"></i>').join('')
   +'</span><span>'+left+' question'+(left>1?'s':'')+' restante'+(left>1?'s':'')+' aujourd’hui</span>';
}
function askAbout(ref,txt,q){
  const ta=$('#chatIn'); if(!ta) return;
  ta.value = q ? q : 'Je lis '+ref+' : « '+txt+' ». Qu’est-ce que ça veut dire exactement ?';
  ta.focus(); ta.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ══════════════ CURSUS, structure d'institut ══════════════ */
let curNiveau='base', curCours=null;
const TYPES={E:['Exégèse'],D:['Doctrine'],P:['Pratique'],G:['Langue']};
const coursDone=c=>store.get('pq-cours-'+c)==='1';
function allCours(){const a=[];CURSUS.niveaux.forEach(n=>n.groupes.forEach(g=>g.cours.forEach(c=>a.push(c))));return a}

function renderCours(){
  if(curCours&&LECONS[curCours]) return renderFiche();
  const tous=allCours(), fait=tous.filter(c=>coursDone(c.c)).length;
  const heures=tous.reduce((a,c)=>a+c.h,0), hFait=tous.filter(c=>coursDone(c.c)).reduce((a,c)=>a+c.h,0);

   +'<h1>Un cursus complet,<br>dans l\u2019ordre</h1>'
   +'<p class="lede">Soixante-quinze cours, du niveau Base à l\u2019Approfondissement, plus le grec ancien. La progression d\u2019un institut biblique, à votre rythme.</p></header>';

  h+='<div class="card pad"><span class="kicker">Votre progression</span>'
   +'<h3 style="margin-top:6px">'+fait+' cours validé'+(fait>1?'s':'')+' sur '+tous.length+'</h3>'
   +'<div class="progress-wrap"><div class="bar"><i style="width:'+Math.round(fait/tous.length*100)+'%"></i></div>'
   +'<span class="pct">'+Math.round(fait/tous.length*100)+' %</span></div>'
   +'<div class="grid2" style="margin-top:18px">'
   +'<div class="mini"><strong>Volume horaire</strong><span>'+hFait+' h suivies sur '+heures+' h au total</span></div>'
   +'<div class="mini"><strong>Rythme conseillé</strong><span>Deux cours par mois, soit environ six ans pour le cursus entier</span></div>'
   +'</div></div>';

  h+='<div class="chips" style="margin:26px 0 0">'
   +CURSUS.niveaux.map(n=>'<button class="chip" aria-selected="'+(n.id===curNiveau)+'" data-niv="'+n.id+'">'+esc(n.nom)+'</button>').join('')
   +'</div>';

  const N=CURSUS.niveaux.find(n=>n.id===curNiveau)||CURSUS.niveaux[0];
  const nb=N.groupes.reduce((a,g)=>a+g.cours.length,0);
  const nbF=N.groupes.reduce((a,g)=>a+g.cours.filter(c=>coursDone(c.c)).length,0);
  h+='<div class="card"><div class="lvl-head"><div class="ln2">'+nbF+' / '+nb+' cours</div>'
   +'<h3>'+esc(N.nom)+'</h3><div class="ls">'+esc(N.sous)+'</div><div class="li">'+esc(N.intro)+'</div></div>';
  N.groupes.forEach(g=>{
    if(g.nom) h+='<div class="grp">'+esc(g.nom)+'</div>';
    g.cours.forEach(c=>{
      const ready=!!LECONS[c.c];
      h+='<button class="course'+(coursDone(c.c)?' done':'')+(ready?' ready':'')+'" data-cours="'+c.c+'">'
       +'<span class="code">'+(coursDone(c.c)?'\u2713':c.c)+'</span>'
       +'<span style="flex:1;min-width:0"><span class="ct">'+esc(c.t)+'</span>'
       +'<span class="cp">'+esc(c.p)+(ready?'':' \u00b7 fiche à venir')+'</span></span>'
       +'<span class="ctype">'+TYPES[c.ty][0]+' \u00b7 '+c.h+' h</span></button>';
    });
  });
  h+='</div>';

  h+='<h2 class="sect">Les grandes familles chrétiennes</h2>'
   +'<p class="sub">Présentées honnêtement, chacune comme elle se décrit, puis les vrais points de divergence.</p>'
   +'<div class="card pad"><div class="chips">'
   +TRADITIONS.map((t,i)=>'<button class="chip" aria-selected="'+(i===0)+'" data-branch="'+t.k+'">'
     +(t.k==='autres'?'Autres religions':t.n.replace(/^(Le |L\u2019|Les )/,''))+'</button>').join('')+'</div>'
   +TRADITIONS.map((t,i)=>'<div class="branch'+(i===0?' on':'')+'" data-branch="'+t.k+'"><h3>'+t.n+'</h3>'
     +'<p style="margin-top:8px">'+t.i+'</p><div class="grid2">'
     +t.m.map(x=>'<div class="mini"><strong>'+x[0]+'</strong><span>'+x[1]+'</span></div>').join('')+'</div></div>').join('')
   +'</div>';

  h+='<div class="foot">Structure de cursus calquée sur le modèle des instituts bibliques francophones.<br>'
   +'<span style="opacity:.7">Le Pain Quotidien, prototype de design, juillet 2026</span></div>';
  $('#p-cours').innerHTML=h;

  $$('#p-cours [data-niv]').forEach(b=>b.onclick=()=>{curNiveau=b.dataset.niv;renderCours();scrollTop()});
  $$('#p-cours .course').forEach(b=>b.onclick=()=>{
    const c=b.dataset.cours;
    if(LECONS[c]){curCours=c;renderCours();scrollTop()}

  $$('#p-cours [data-branch]').forEach(c=>{if(c.tagName==='BUTTON')c.onclick=()=>{
    $$('#p-cours .chip[data-branch]').forEach(x=>x.setAttribute('aria-selected',String(x===c)));
    $$('#p-cours .branch').forEach(x=>x.classList.toggle('on',x.dataset.branch===c.dataset.branch));
  }});
}

function renderFiche(){
  const L=LECONS[curCours]; let meta=null,niv=null;
  CURSUS.niveaux.forEach(n=>n.groupes.forEach(g=>g.cours.forEach(c=>{if(c.c===curCours){meta=c;niv=n}})));
  let h='<header class="hero"><div class="eyebrow">'+esc(niv.nom)+' \u00b7 '+curCours+'</div>'
   +'<h1>'+esc(L.titre)+'</h1><p class="lede">'+TYPES[meta.ty][0]+' \u00b7 '+meta.h+' heures \u00b7 '+esc(meta.p)+'</p></header>'
   +'<button class="back" id="backCours">\u2039 Retour au cursus</button>'
   +'<div class="card pad"><span class="kicker">Objectifs du cours</span><ul class="obj">'
   +L.objectifs.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ul></div>'
   +'<div class="card pad pq"><span class="kicker">Pour entrer dans le sujet</span><p class="parable">'+esc(L.parabole)+'</p></div>';
  L.corps.forEach(sec=>{
    h+='<div class="card pad pq"><span class="kicker">'+esc(sec.h)+'</span>'
     +sec.p.map((x,i)=>'<p'+(i===0?' class="lead"':'')+'>'+x+'</p>').join('')+'</div>';
  });
  h+='<div class="card pad"><span class="kicker">Verset directeur</span>'
   +'<div class="keyv" style="margin-top:4px"><p>'+esc(L.verset)+'<br><span class="ref-inline">'+esc(L.vref)+'</span></p></div>'
   +'<h3 style="margin-top:26px">Lectures obligatoires</h3><ul class="mlist">'
   +L.lectures.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'
   +'<h3 style="margin-top:22px">Travail à rendre</h3><p style="margin-top:8px">'+esc(L.travail)+'</p>'
   +'<div class="share-grid" style="margin-top:24px"><button class="btn primary" id="markCours">'
   +(coursDone(curCours)?'Cours validé \u2713':'Valider ce cours')+'</button></div></div>';
  $('#p-cours').innerHTML=h;
  $('#backCours').onclick=()=>{curCours=null;renderCours();scrollTop()};
  $('#markCours').onclick=()=>{const on=!coursDone(curCours);store.set('pq-cours-'+curCours,on?'1':'0');
    toast(on?'Cours validé.':'Validation retirée.');renderCours()};
}

/* ══════════════ OUTILS ══════════════ */
function copy(t,m){
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>toast(m||'Copié.'),()=>toast('Copie impossible.'));
  else{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();
    try{document.execCommand('copy');toast(m||'Copié.')}catch(e){toast('Copie impossible.')}a.remove()}
}
function makeStory(){
  const D=DAYS[cur],c=$('#cv'),x=c.getContext('2d'),W=1080,H=1920;
  const soir=document.documentElement.dataset.mode==='soir';
  const bg=soir?'#0E141A':'#FBFBFC',ink=soir?'#EDF1F5':'#1A222B',acc=soir?'#8FA9C4':'#4E6A85';
  x.fillStyle=bg;x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W/2,340,0,W/2,340,760);
  g.addColorStop(0,soir?'rgba(143,169,196,.18)':'rgba(78,106,133,.16)');g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g;x.fillRect(0,0,W,H);x.textAlign='center';
  x.fillStyle=acc;x.font='600 30px -apple-system,Helvetica,Arial';x.fillText('LE PAIN QUOTIDIEN',W/2,300);
  x.font='400 30px -apple-system,Helvetica,Arial';x.fillStyle=soir?'#8E9BA8':'#6B7784';
  x.fillText(fdate(cur).toUpperCase(),W/2,356);
  x.fillStyle=ink;x.font='500 70px Georgia,"Times New Roman",serif';
  const words=D.verset.plain.split(' ');let line='',lines=[];
  words.forEach(w=>{const t=line?line+' '+w:w;if(x.measureText(t).width>820&&line){lines.push(line);line=w}else line=t});
  lines.push(line);
  let y=H/2-(lines.length-1)*52;lines.forEach(l=>{x.fillText(l,W/2,y);y+=104});
  x.fillStyle=acc;x.font='600 32px -apple-system,Helvetica,Arial';
  x.fillText(D.verset.ref.toUpperCase()+'  ·  SEGOND',W/2,y+46);
  x.strokeStyle=acc;x.lineWidth=2;x.globalAlpha=.4;
  x.beginPath();x.moveTo(W/2-70,H-340);x.lineTo(W/2+70,H-340);x.stroke();x.globalAlpha=1;
  x.fillStyle=soir?'#5E6A76':'#9AA5B1';x.font='400 27px -apple-system,Helvetica,Arial';
  x.fillText('painquotidien.app',W/2,H-250);
  c.toBlob(b=>{const u=URLAPI.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download='pain-quotidien-'+cur+'.png';a.click();
    setTimeout(()=>URLAPI.revokeObjectURL(u),1500);toast('Image téléchargée.')},'image/png');
}

function setMode(m,rem){
  document.documentElement.dataset.mode=m;
  $('#modeIcon').innerHTML=(m==='soir')?SUN:MOON;
  const mt=document.querySelector('meta[name=theme-color]'); if(mt) mt.content=(m==='soir')?'#0E141A':'#FBFBFC';
  if(rem)store.set('pq-mode',m);
}

setMode(store.get('pq-mode')||(now.getHours()>=20||now.getHours()<5?'soir':'matin'),false);

function gotoTab(name){
  $$('.tab').forEach(x=>x.setAttribute('aria-selected',String(x.dataset.panel===name)));
  $$('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+name));
  $('#daybar').style.display=(name==='matin'||name==='temoigner'||name==='soir')?'':'none';
  if(name==='lire')renderLire();
  if(name==='questions')renderQuestions();
  if(name==='cours')renderCours();
}
$$('.tab').forEach(t=>t.onclick=()=>{gotoTab(t.dataset.panel);scrollTop()});
