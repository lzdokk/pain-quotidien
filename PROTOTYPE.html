<!DOCTYPE html>
<html lang="fr" data-mode="matin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Pain quotidien</title>
<meta name="description" content="Le pain du matin, la veillée du soir, un carnet de lecture biblique et un cursus complet.">
<meta name="theme-color" content="#FBFBFC">
<style>
:root{
  --ink:#1A222B; --ink-2:#3C4854; --ink-3:#6B7784; --ink-4:#9AA5B1;
  --line:rgba(0,0,0,.075); --line-2:rgba(0,0,0,.14);
  --bg:#FBFBFC; --surface:#FFFFFF; --surface-2:#F2F4F7;
  --accent:#4E6A85; --accent-soft:rgba(78,106,133,.10); --accent-line:rgba(78,106,133,.28);
  --hl1:rgba(240,196,110,.42); --hl2:rgba(126,196,166,.36); --hl3:rgba(140,172,214,.40); --hl4:rgba(226,150,160,.36);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 28px -12px rgba(0,0,0,.10);
  --shadow-lg:0 2px 6px rgba(0,0,0,.05), 0 30px 70px -30px rgba(0,0,0,.22);
  --r:22px; --r-sm:14px;
  --serif:"New York","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1); --maxw:720px;
}
html[data-mode="soir"]{
  --ink:#EDF1F5; --ink-2:#C0CBD6; --ink-3:#8E9BA8; --ink-4:#5E6A76;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --bg:#0E141A; --surface:#151C24; --surface-2:#1D262F;
  --accent:#8FA9C4; --accent-soft:rgba(143,169,196,.12); --accent-line:rgba(143,169,196,.30);
  --hl1:rgba(255,214,102,.26); --hl2:rgba(126,211,160,.22); --hl3:rgba(150,183,255,.24); --hl4:rgba(255,158,158,.22);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5), 0 30px 70px -30px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;letter-spacing:-.011em;
 -webkit-font-smoothing:antialiased;transition:background .7s var(--ease),color .7s var(--ease);padding-bottom:96px;overflow-x:hidden}
::selection{background:var(--accent-soft);color:var(--ink)}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

.nav{position:sticky;top:0;z-index:60;backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);
 background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--maxw);margin:0 auto;padding:0 24px;height:56px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.02em;flex:none}
.brand .glyph{width:22px;height:22px;flex:none}
@media(max-width:900px){.brand span{display:none}}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:99px;overflow-x:auto;scrollbar-width:none;margin:0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;color:var(--ink-3);font:inherit;font-size:13px;font-weight:530;letter-spacing:-.01em;
 padding:6px 12px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:color .3s var(--ease),background .3s var(--ease)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.icon-btn{border:1px solid var(--line-2);background:transparent;color:var(--ink-2);width:34px;height:34px;border-radius:99px;
 cursor:pointer;display:grid;place-items:center;flex:none;transition:.3s var(--ease);font:inherit;font-size:12px;font-weight:640;overflow:hidden}
.icon-btn:hover{background:var(--surface-2);transform:scale(1.06)}
.icon-btn.avatar{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-mode="soir"] .icon-btn.avatar{color:#0E141A}

.daybar{position:sticky;top:56px;z-index:55;background:color-mix(in srgb,var(--bg) 90%,transparent);
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line)}
.daybar-in{max-width:var(--maxw);margin:0 auto;padding:11px 24px;display:flex;align-items:center;gap:10px}
.nav-day{border:1px solid var(--line-2);background:transparent;color:var(--ink-2);width:30px;height:30px;border-radius:99px;
 cursor:pointer;display:grid;place-items:center;flex:none;transition:.25s var(--ease)}
.nav-day:hover:not(:disabled){background:var(--surface-2);border-color:var(--accent-line);color:var(--accent)}
.nav-day:disabled{opacity:.3;cursor:default}
.week{display:flex;gap:5px;flex:1;justify-content:center;overflow-x:auto;scrollbar-width:none}
.week::-webkit-scrollbar{display:none}
.day{border:1px solid transparent;background:transparent;cursor:pointer;font:inherit;border-radius:12px;padding:5px 0;width:42px;
 flex:none;text-align:center;transition:.25s var(--ease);position:relative}
.day:hover{background:var(--surface-2)}
.day .dw{display:block;font-size:9.5px;font-weight:640;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-4)}
.day .dn{display:block;font-size:15px;font-weight:560;color:var(--ink-2);line-height:1.3}
.day[aria-current="true"]{background:var(--accent);border-color:var(--accent)}
.day[aria-current="true"] .dw,.day[aria-current="true"] .dn{color:#fff}
html[data-mode="soir"] .day[aria-current="true"] .dw,html[data-mode="soir"] .day[aria-current="true"] .dn{color:#0E141A}
.day .done-dot{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:4px;height:4px;border-radius:99px;background:var(--accent)}
.day[aria-current="true"] .done-dot{background:#fff}
.streak{font-size:11.5px;color:var(--ink-3);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
@media(max-width:600px){.streak{display:none}}

.hero{padding:60px 0 40px;text-align:center;position:relative}
.hero::before{content:"";position:absolute;inset:-140px 0 auto;height:420px;z-index:-1;
 background:radial-gradient(60% 60% at 50% 0%,var(--accent-soft),transparent 70%);pointer-events:none}
.eyebrow{font-size:11.5px;font-weight:640;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
.date{font-size:15px;color:var(--ink-3);margin-bottom:6px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(36px,7vw,56px);line-height:1.07;letter-spacing:-.028em;margin:10px 0 20px}
.hero p.lede{font-size:18px;color:var(--ink-2);max-width:34ch;margin:0 auto;line-height:1.55}
.liturgy{display:inline-flex;align-items:center;gap:8px;margin-top:24px;font-size:12.5px;color:var(--ink-3);
 border:1px solid var(--line);border-radius:99px;padding:6px 14px;background:var(--surface)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--accent);flex:none}

section.panel{display:none}
section.panel.on{display:block;animation:fade .5s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin:16px 0;overflow:hidden;
 transition:box-shadow .4s var(--ease),background .7s var(--ease)}
.card.pad{padding:30px 30px 34px}
.kicker{font-size:11px;font-weight:640;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:block}
h2.sect{font-family:var(--serif);font-size:29px;font-weight:600;letter-spacing:-.022em;line-height:1.2;margin:52px 0 6px}
h2.sect + .sub{color:var(--ink-3);font-size:15px;margin-bottom:20px}
h3{font-size:18px;font-weight:600;letter-spacing:-.017em;line-height:1.35}
.card p{color:var(--ink-2);font-size:16.5px;line-height:1.72}
.card p + p{margin-top:15px}

.prayer{background:var(--surface-2);border-left:2.5px solid var(--accent-line);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:26px 28px;margin:16px 0}
.prayer .kicker{margin-bottom:10px}
.prayer p{font-family:var(--serif);font-size:17.5px;line-height:1.74;color:var(--ink-2);font-style:italic}
.prayer.opening{background:linear-gradient(180deg,var(--accent-soft),transparent);border:1px solid var(--accent-line);
 border-left:3px solid var(--accent);border-radius:var(--r);padding:32px;margin-top:0}
.prayer.opening p{font-size:18.5px;color:var(--ink)}

.rd{border-bottom:1px solid var(--line);padding:30px}
.rd:last-child{border-bottom:0}
.rd-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.num{width:26px;height:26px;flex:none;border-radius:99px;border:1px solid var(--accent-line);color:var(--accent);
 font-size:11.5px;font-weight:640;display:grid;place-items:center;margin-top:2px}
.rd-ref{font-size:12.5px;color:var(--ink-3);margin-bottom:3px;letter-spacing:.02em;display:block}
.rd-title{font-size:17px;font-weight:600;letter-spacing:-.016em;line-height:1.35;display:block}
.scripture{font-family:var(--serif);border-left:2.5px solid var(--accent-line);padding-left:22px}
.scripture p{font-family:var(--serif);font-size:17.5px;line-height:1.85;color:var(--ink);margin:0}
.scripture p + p{margin-top:13px}
.scripture .v{font-family:var(--sans);font-size:10.5px;font-weight:660;color:var(--accent);vertical-align:.5em;margin-right:4px;letter-spacing:0}
.rd-sum{margin-top:22px;background:var(--surface-2);border-radius:var(--r-sm);padding:20px 22px}
.rd-sum strong{display:block;font-size:11px;font-weight:640;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.rd-sum p{font-size:15.5px;line-height:1.68;color:var(--ink-2)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);
 border:1px solid var(--accent-line);border-radius:99px;padding:3px 10px;margin-top:12px}
.note-canon{margin-top:14px;font-size:13px;color:var(--ink-3);background:var(--surface-2);border-radius:10px;padding:12px 14px;line-height:1.55}

.verse{background:linear-gradient(180deg,var(--accent-soft),transparent);border:1px solid var(--accent-line);text-align:center;padding:46px 34px}
.verse blockquote{font-family:var(--serif);font-size:clamp(21px,4vw,28px);line-height:1.44;letter-spacing:-.018em;color:var(--ink)}
.verse cite{display:block;margin-top:20px;font-style:normal;font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.04em}
.pq h3{margin:30px 0 10px}
.pq h3:first-of-type{margin-top:4px}
.pq .lead{font-size:18px;line-height:1.68;color:var(--ink)}
.ref-inline{font-size:13.5px;color:var(--accent);font-weight:560;white-space:nowrap}

.steps{list-style:none;margin-top:8px}
.steps li{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0;padding-bottom:0}
.tick{width:24px;height:24px;flex:none;border-radius:8px;border:1.5px solid var(--line-2);background:transparent;cursor:pointer;
 display:grid;place-items:center;margin-top:1px;transition:.28s var(--ease)}
.tick svg{opacity:0;transform:scale(.5);transition:.28s var(--ease);color:#fff}
html[data-mode="soir"] .tick svg{color:#0E141A}
.tick[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.tick[aria-pressed="true"] svg{opacity:1;transform:none}
.steps li.done .st-txt{color:var(--ink-4);text-decoration:line-through;text-decoration-color:var(--line-2)}
.st-txt{font-size:16px;color:var(--ink-2);line-height:1.62;transition:.3s var(--ease)}
.st-txt b{color:var(--ink);font-weight:600}

.breathe{display:grid;place-items:center;padding:52px 0 34px}
.orb{width:150px;height:150px;border-radius:99px;background:radial-gradient(circle at 50% 42%,var(--accent-soft),transparent 68%);
 border:1px solid var(--accent-line);display:grid;place-items:center;animation:breathe 11s var(--ease) infinite}
.orb span{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);font-weight:600}
@keyframes breathe{0%,100%{transform:scale(.86);opacity:.62}50%{transform:scale(1.1);opacity:1}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}}

/* CURSUS */
.progress-wrap{display:flex;align-items:center;gap:14px;margin-top:20px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s var(--ease)}
.progress-wrap .pct{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.module{border-bottom:1px solid var(--line)}
.module:last-child{border-bottom:0}
.mod-h{padding:22px 30px 16px;display:flex;align-items:baseline;gap:12px}
.mod-n{font-size:11px;font-weight:660;letter-spacing:.12em;color:var(--accent);flex:none}
.mod-t{font-size:17px;font-weight:620;letter-spacing:-.016em}
.mod-s{font-size:13.5px;color:var(--ink-3);margin-left:auto;text-align:right}
@media(max-width:560px){.mod-s{display:none}}
.lesson{display:flex;gap:14px;align-items:flex-start;padding:13px 30px;cursor:pointer;transition:background .25s var(--ease);
 border:0;background:transparent;width:100%;text-align:left;font:inherit}
.lesson:hover{background:var(--surface-2)}
.ln{width:26px;height:26px;flex:none;border-radius:99px;border:1.5px solid var(--line-2);color:var(--ink-4);font-size:11px;
 font-weight:660;display:grid;place-items:center;margin-top:2px;transition:.25s var(--ease)}
.lesson.done .ln{background:var(--accent);border-color:var(--accent);color:#fff}
.lesson.current .ln{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lt{font-size:15.5px;font-weight:540;letter-spacing:-.012em;color:var(--ink);line-height:1.4;display:block}
.lp{font-size:13.5px;color:var(--ink-3);line-height:1.55;margin-top:3px;display:block}
.lesson.done .lt{color:var(--ink-3)}
.back{border:0;background:transparent;color:var(--accent);font:inherit;font-size:13.5px;font-weight:560;cursor:pointer;
 padding:0;display:flex;align-items:center;gap:6px;margin-bottom:18px}
.parable{font-family:var(--serif);font-size:17.5px;line-height:1.76;color:var(--ink-2);border-left:2.5px solid var(--accent-line);
 padding-left:22px;margin:20px 0}
.keyv{background:var(--surface-2);border-radius:var(--r-sm);padding:18px 22px;margin-top:22px}
.keyv strong{display:block;font-size:11px;font-weight:640;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.keyv p{font-family:var(--serif);font-size:16.5px;line-height:1.7;color:var(--ink)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 4px}
.chip{border:1px solid var(--line-2);background:transparent;color:var(--ink-2);font:inherit;font-size:13px;font-weight:520;
 padding:7px 15px;border-radius:99px;cursor:pointer;transition:.28s var(--ease)}
.chip:hover{border-color:var(--accent-line);color:var(--ink)}
.chip[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-mode="soir"] .chip[aria-selected="true"]{color:#0E141A}
.branch{display:none;animation:fade .45s var(--ease);padding-top:22px}
.branch.on{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.mini{background:var(--surface-2);border-radius:var(--r-sm);padding:18px 20px}
.mini strong{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px;font-weight:640}
.mini span{font-size:15px;color:var(--ink-2);line-height:1.6}

.gospel .mv{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.gospel .mv:last-child{border-bottom:0}
.gospel .mv-n{width:30px;height:30px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;
 font-weight:680;display:grid;place-items:center;margin-top:2px}
.gospel h4{font-size:16.5px;font-weight:620;letter-spacing:-.015em;margin-bottom:6px}
.gospel p{font-size:15.5px;line-height:1.68;color:var(--ink-2)}
.gospel .vv{display:block;margin-top:7px;font-size:13px;color:var(--accent);font-weight:560}
.opener{border:1px solid var(--line);border-radius:var(--r-sm);padding:18px 20px 28px;margin-top:12px;font-family:var(--serif);
 font-size:16.5px;line-height:1.65;color:var(--ink);font-style:italic;position:relative;cursor:pointer;transition:.28s var(--ease)}
.opener:hover{border-color:var(--accent-line);background:var(--surface-2)}
.opener::after{content:"copier";position:absolute;right:16px;bottom:10px;font-family:var(--sans);font-style:normal;font-size:10.5px;
 letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4)}

input.field,select.field,textarea.field{width:100%;border:1px solid var(--line-2);background:transparent;color:var(--ink);font:inherit;
 font-size:16px;padding:13px 15px;border-radius:var(--r-sm);transition:.28s var(--ease);-webkit-appearance:none;appearance:none}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
 background-position:calc(100% - 18px) 22px,calc(100% - 13px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
input.field:focus,select.field:focus,textarea.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.field::placeholder,textarea.field::placeholder{color:var(--ink-4)}
textarea.field{resize:vertical;min-height:90px;line-height:1.6}

.share-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:14.5px;font-weight:540;
 letter-spacing:-.01em;padding:15px 18px;border-radius:var(--r-sm);cursor:pointer;display:flex;align-items:center;justify-content:center;
 gap:9px;transition:.28s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent-line)}
.btn:active{transform:translateY(0) scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-mode="soir"] .btn.primary{color:#0E141A}
.btn.sm{padding:9px 14px;font-size:13px;border-radius:10px}
.preview{margin-top:26px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface-2);padding:22px 24px;
 font-size:14.5px;color:var(--ink-3);line-height:1.7;white-space:pre-wrap}

/* ---------- LECTEUR BIBLE ---------- */
.reader-bar{display:grid;grid-template-columns:1.4fr 1.6fr .8fr;gap:10px;margin-top:18px}
@media(max-width:600px){.reader-bar{grid-template-columns:1fr 1fr}.reader-bar select:first-child{grid-column:1 / -1}}
.chap-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 30px;border-bottom:1px solid var(--line)}
.chap-title{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:-.018em}
.vlist{padding:26px 30px 30px}
.vs{display:block;padding:3px 6px;margin:0 -6px;border-radius:7px;cursor:pointer;font-family:var(--serif);font-size:17.5px;
 line-height:1.9;color:var(--ink);transition:background .2s var(--ease)}
.vs:hover{background:var(--surface-2)}
.vs .vn{font-family:var(--sans);font-size:10.5px;font-weight:660;color:var(--accent);vertical-align:.5em;margin-right:5px}
.vs.h1{background:var(--hl1)}.vs.h2{background:var(--hl2)}.vs.h3{background:var(--hl3)}.vs.h4{background:var(--hl4)}
.vs.sel{box-shadow:0 0 0 2px var(--accent)}
.vs .noteflag{display:inline-block;margin-left:6px;font-family:var(--sans);font-size:10px;font-weight:660;color:var(--accent);
 border:1px solid var(--accent-line);border-radius:5px;padding:0 5px;vertical-align:2px}
.vbar{position:sticky;bottom:14px;margin:16px 30px 0;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;
 box-shadow:var(--shadow-lg);padding:12px 14px;display:none;animation:fade .3s var(--ease);z-index:20}
.vbar.on{display:block}
.vbar .vref{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.vbar-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:8px;border:1px solid var(--line-2);cursor:pointer;transition:.2s var(--ease)}
.swatch:hover{transform:scale(1.12)}
.swatch.s1{background:var(--hl1)}.swatch.s2{background:var(--hl2)}.swatch.s3{background:var(--hl3)}.swatch.s4{background:var(--hl4)}
.swatch.s0{background:transparent;position:relative}
.swatch.s0::after{content:"";position:absolute;inset:6px;border-top:1.5px solid var(--ink-3);transform:rotate(-45deg)}

/* carnet */
.entry{border-bottom:1px solid var(--line);padding:18px 0}
.entry:last-child{border-bottom:0}
.entry .eref{font-size:12px;font-weight:640;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.entry .etext{font-family:var(--serif);font-size:16px;line-height:1.7;color:var(--ink);padding-left:12px;border-left:2px solid var(--accent-line)}
.entry .enote{font-size:15px;color:var(--ink-2);line-height:1.65;margin-top:10px;background:var(--surface-2);padding:12px 14px;border-radius:10px}
.entry .edel{border:0;background:transparent;color:var(--ink-4);font:inherit;font-size:12px;cursor:pointer;margin-top:8px;padding:0}
.entry .edel:hover{color:var(--ink-2)}
.empty{color:var(--ink-3);font-size:15px;line-height:1.65;padding:8px 0}

/* parcours */
.step{display:flex;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step-n{width:30px;height:30px;flex:none;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-size:13px;
 font-weight:680;display:grid;place-items:center;margin-top:2px}
.step.done .step-n{background:var(--accent);color:#fff}
html[data-mode="soir"] .step.done .step-n{color:#0E141A}
.step h4{font-size:16.5px;font-weight:620;letter-spacing:-.015em}
.step .sm{font-size:13px;color:var(--ink-3);margin-top:2px}
.step p{font-size:15px;line-height:1.68;color:var(--ink-2);margin-top:8px}
.step .cles{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.step .cles span{font-size:12px;color:var(--ink-3);background:var(--surface-2);border-radius:7px;padding:4px 9px}
.today-read{background:linear-gradient(180deg,var(--accent-soft),transparent);border:1px solid var(--accent-line);
 border-radius:var(--r);padding:28px 30px}
.big-ref{font-family:var(--serif);font-size:32px;font-weight:600;letter-spacing:-.022em;margin:6px 0 4px}

/* FAQ / chat */
.faq-item{border-bottom:1px solid var(--line)}
.faq-item:last-child{border-bottom:0}
.faq-q{width:100%;text-align:left;border:0;background:transparent;font:inherit;cursor:pointer;padding:20px 30px;display:flex;
 gap:14px;align-items:flex-start;transition:background .25s var(--ease)}
.faq-q:hover{background:var(--surface-2)}
.faq-q .qi{width:24px;height:24px;flex:none;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-size:12px;
 font-weight:680;display:grid;place-items:center;margin-top:1px}
.faq-q .qt{font-size:16px;font-weight:540;letter-spacing:-.013em;line-height:1.45;color:var(--ink)}
.faq-q .qc{font-size:12px;color:var(--ink-4);margin-top:3px;display:block}
.chatbox{border:1px solid var(--line-2);border-radius:var(--r);padding:22px;background:var(--surface-2);margin-top:20px}
.quota{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);margin-bottom:14px}
.quota .qd{display:flex;gap:3px}
.quota .qd i{width:7px;height:7px;border-radius:99px;background:var(--accent);display:block}
.quota .qd i.off{background:var(--line-2)}
.msg{border-radius:14px;padding:16px 18px;margin-top:12px;font-size:15.5px;line-height:1.7;animation:fade .4s var(--ease)}
.msg.me{background:var(--accent);color:#fff;margin-left:40px}
html[data-mode="soir"] .msg.me{color:#0E141A}
.msg.bot{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);margin-right:20px}
.msg.bot .src{display:block;margin-top:12px;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4)}
.msg.bot .par{font-family:var(--serif);font-style:italic;border-left:2px solid var(--accent-line);padding-left:14px;margin:12px 0}

.foot{text-align:center;padding:70px 0 20px;color:var(--ink-4);font-size:13px;line-height:1.8}
.foot a{color:var(--ink-3);text-decoration:none;border-bottom:1px solid var(--line-2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-size:14px;
 font-weight:520;padding:12px 22px;border-radius:99px;z-index:99;opacity:0;pointer-events:none;transition:.4s var(--ease);box-shadow:var(--shadow-lg)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:120;display:none;place-items:center;padding:24px;
 background:color-mix(in srgb,var(--bg) 60%,rgba(0,0,0,.5))}
.sheet.on{display:grid;animation:fade .3s var(--ease)}
.sheet-in{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow-lg);max-width:420px;
 width:100%;padding:34px 32px;text-align:center}
.banner{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-sm);padding:16px 18px;margin:16px 0;
 font-size:14.5px;color:var(--ink-2);line-height:1.6;display:flex;gap:12px;align-items:flex-start}
.banner b{color:var(--ink)}

/* ---------- LECTURES EN VOLETS ---------- */
.rd-toggle{width:100%;text-align:left;border:0;background:transparent;font:inherit;cursor:pointer;padding:22px 30px;
 display:flex;gap:14px;align-items:flex-start;transition:background .25s var(--ease)}
.rd-toggle:hover{background:var(--surface-2)}
.rd-toggle .chev{margin-left:auto;color:var(--ink-4);flex:none;margin-top:5px;transition:transform .35s var(--ease)}
.rd.open .rd-toggle .chev{transform:rotate(180deg)}
.rd-body{display:none;padding:0 30px 28px 70px}
.rd.open .rd-body{display:block;animation:fade .4s var(--ease)}

.rd-teaser{font-size:14px;color:var(--ink-3);line-height:1.55;margin-top:6px;display:block}

.modal.on{display:flex;animation:fade .28s var(--ease)}

.modal-in .par{font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.7;color:var(--ink-2);

.wordbox{background:linear-gradient(180deg,var(--accent-soft),transparent);border:1px solid var(--accent-line);border-radius:14px;

.vrefs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.vrefs button{border:1px solid var(--accent-line);background:transparent;color:var(--accent);font:inherit;font-size:12.5px;
 font-weight:560;padding:5px 11px;border-radius:99px;cursor:pointer;transition:.25s var(--ease)}
.vrefs button:hover{background:var(--accent-soft)}

.obj{list-style:none;margin-top:8px}

window.FAQ = [
{id:1,cat:'Dieu et le mal',q:"Si Dieu existe, pourquoi le mal existe-t-il ?",
 court:"Parce que Dieu a créé des êtres libres, et que la liberté d’aimer implique la liberté de détruire. Mais il n’a pas regardé le résultat de loin : il est entré dedans.",
 parabole:"Un père construit une maison pour ses enfants. Il pourrait les enchaîner à leur lit, ils ne se blesseraient jamais. Il pourrait aussi ne jamais leur donner de couteau, ils ne pourraient jamais cuisiner. Il choisit de leur laisser la maison entière, en sachant ce que ça coûtera. Le jour où l’un se blesse, il ne regarde pas depuis la fenêtre : il descend, et il saigne avec lui.",
 dev:["La réponse classique commence par la liberté. Un amour contraint n’est pas de l’amour, c’est un mécanisme. Pour qu’un être puisse dire oui, il faut qu’il puisse dire non. Le mal est le prix de cette possibilité, et il ne pouvait pas être supprimé sans supprimer aussi ce qui a de la valeur.",
  "Mais cette réponse ne suffit pas, et il faut le reconnaître honnêtement : elle explique le mal moral, pas le tsunami ni la tumeur. La Bible ne prétend d’ailleurs pas tout expliquer. Le livre de Job, quarante-deux chapitres sur la souffrance d’un innocent, ne donne jamais la raison. Dieu n’argumente pas, il se montre.",
  "Ce que le christianisme apporte de spécifique n’est donc pas une explication complète, c’est une position. Dans presque toutes les autres visions du monde, la divinité reste au-dessus de la souffrance. Ici, elle y descend. Le Dieu chrétien est le seul dont on peut dire qu’il a été torturé, qu’il a crié l’abandon, et qu’il est mort. Cela ne résout pas le problème intellectuel. Cela change complètement la solitude.",
  "Enfin, la Bible refuse de dire que le mal est normal ou définitif. Elle le traite comme un intrus et elle annonce sa fin. L’espérance chrétienne n’est pas que la souffrance ait un sens caché, c’est qu’elle aura une fin datée."],
 versets:['Job 38.1-4','Romains 8.18-23','Apocalypse 21.4']},

{id:2,cat:'Dieu et le mal',q:"Pourquoi Dieu laisse-t-il des enfants avoir un cancer ?",
 court:"C’est la question la plus dure, et elle mérite qu’on refuse les réponses faciles. La Bible ne dit jamais que ces enfants sont punis, ni que Dieu l’a voulu.",
 parabole:"Un médecin annonce un diagnostic terrible à des parents. Ils lui demandent pourquoi. Il pourrait leur faire un cours sur les mutations cellulaires : ce serait exact, et parfaitement inutile. Ce qu’ils demandent n’est pas une cause, c’est une présence. Un bon médecin le comprend, s’assoit, et reste.",
 dev:["Première chose à écarter, parce qu’elle blesse et qu’elle traîne partout : l’idée que la maladie serait un châtiment. Jésus l’a explicitement démentie. En Jean 9, devant un aveugle de naissance, ses disciples demandent qui a péché. Sa réponse est nette : ni lui, ni ses parents. En Luc 13, il refuse de la même façon d’interpréter un accident comme une sanction.",
  "Deuxième chose : le christianisme n’enseigne pas que le monde tel qu’il est correspond au projet de Dieu. Il enseigne l’inverse. Le monde est abîmé, la création elle-même « soupire », et la mort est appelée « le dernier ennemi ». Un enfant malade n’est pas un élément du plan, c’est une conséquence de ce qui est cassé.",
  "Troisième chose, la plus difficile : il n’existe pas de réponse au « pourquoi lui ». Toute personne qui vous en donne une rapidement se trompe, ou ment. Job réclame une explication pendant quarante chapitres et n’en reçoit aucune. Ce qu’il reçoit, c’est une rencontre. Et cela lui suffit, ce qui est déroutant.",
  "Ce qu’on peut dire, en revanche : Dieu n’est pas resté à distance de la souffrance des enfants. Il en a eu un, et il l’a vu mourir. Ce n’est pas une consolation qui répare quoi que ce soit. C’est simplement la preuve qu’il sait de quoi il s’agit."],
 versets:['Jean 9.1-3','Luc 13.1-5','Romains 8.22','1 Corinthiens 15.26']},

{id:3,cat:'Dieu et le mal',q:"Pourquoi Dieu ne se montre-t-il pas clairement ?",
 court:"Parce qu’une preuve écrasante forcerait la soumission, pas la confiance. Et parce que, selon la Bible, il s’est montré, mais autrement qu’on l’attendait.",
 parabole:"Un homme très riche veut savoir s’il est aimé pour lui-même. Tant qu’il arrive en costume et en voiture de luxe, il ne le saura jamais. Il s’habille simplement et se présente sans rien dire de sa fortune. Alors seulement la réponse devient réelle.",
 dev:["Une manifestation irréfutable produirait de la certitude, pas de l’amour. Les démons, dit l’épître de Jacques avec un certain humour, sont parfaitement convaincus de l’existence de Dieu et tremblent. La conviction intellectuelle n’a jamais transformé personne.",
  "La Bible affirme par ailleurs que Dieu se rend visible, mais indirectement : par la création, par la conscience morale, par l’histoire d’un peuple. Ce sont des signes lisibles pour qui regarde, jamais des démonstrations contraignantes.",
  "Et surtout, la revendication centrale du christianisme est que la manifestation a eu lieu. Pas dans le ciel, mais dans une famille d’artisans d’un village sans intérêt. Assez visible pour être reconnaissable, assez discrète pour laisser libre. C’est ce que Jésus refuse en Matthieu 12 quand on lui réclame un signe spectaculaire : il n’en donnera qu’un, sa résurrection.",
  "Reste que le silence de Dieu est une expérience réelle, y compris pour les croyants. Les psaumes en sont pleins. La foi biblique n’est pas l’absence de doute, c’est la décision de continuer à parler à quelqu’un qui ne répond pas tout de suite."],
 versets:['Romains 1.19-20','Jacques 2.19','Matthieu 12.38-40','Psaume 13']},

{id:4,cat:'La foi et le doute',q:"Comment croire quand on n’a pas la foi ?",
 court:"En cherchant, pas en se forçant. La Bible traite le doute comme une étape normale, pas comme une faute.",
 parabole:"Personne ne décide de faire confiance à un pont par un effort de volonté. On regarde ses piliers, on voit d’autres passer, on avance de trois pas. La confiance vient en marchant, elle ne précède pas la marche.",
 dev:["Le premier malentendu est de croire que la foi serait une capacité mystérieuse que certains auraient reçue et d’autres non. Le mot grec <em>pistis</em> signifie d’abord confiance, exactement comme dans une relation humaine. Or la confiance se construit : par ce qu’on apprend, par ce qu’on expérimente, par ce qu’on voit chez d’autres.",
  "Le deuxième malentendu est de penser qu’il faudrait tout comprendre avant de commencer. Les premiers disciples n’ont rien compris pendant trois ans. L’un d’eux, Thomas, a exigé des preuves tactiles, et Jésus les lui a données sans le sermonner.",
  "Concrètement, trois pas fonctionnent bien. Lire un évangile en entier, de préférence Jean, en le prenant comme un document et non comme un test. Parler à Dieu même si l’on n’est pas sûr qu’il existe, une phrase simple : « si tu es là, montre-toi ». Et rencontrer des croyants réels, parce que la foi ne s’attrape pratiquement jamais tout seul devant un écran.",
  "Enfin, la Bible elle-même met dans la bouche d’un père désespéré la prière la plus honnête qui soit : « Je crois, viens au secours de mon incrédulité ». Elle est recevable telle quelle."],
 versets:['Marc 9.24','Jean 20.24-29','Jérémie 29.13','Romains 10.17']},

{id:5,cat:'La foi et le doute',q:"Et si tout ça était juste une invention humaine ?",
 court:"C’est une hypothèse sérieuse, qui mérite d’être testée sur un point précis : la résurrection. Tout le reste en dépend.",
 parabole:"Pour savoir si un billet est faux, on ne discute pas de la couleur de l’encre. On regarde le filigrane. Le christianisme a un filigrane unique et vérifiable : un tombeau vide, et des témoins qui ont préféré mourir plutôt que se rétracter.",
 dev:["Paul lui-même a posé le critère, et il est d’une honnêteté remarquable : « si Christ n’est pas ressuscité, votre foi est vaine ». Il ne propose pas de repli sur les valeurs ou la sagesse. Il joue tout sur un événement historique.",
  "Les faits sur lesquels la plupart des historiens s’accordent, croyants ou non, sont peu nombreux mais réels : Jésus a existé, il a été crucifié sous Ponce Pilate, ses disciples ont sincèrement cru l’avoir vu vivant, et cette conviction a transformé des hommes terrorisés en témoins prêts au martyre. Les explications alternatives existent (hallucination collective, vol du corps, mort apparente) et chacune se heurte à des difficultés sérieuses.",
  "Un détail que les faussaires n’auraient pas inventé : ce sont des femmes qui découvrent le tombeau vide. Dans le contexte juif du premier siècle, leur témoignage n’avait quasiment aucune valeur légale. Personne ne fabrique une preuve avec des témoins irrecevables.",
  "Cela ne constitue pas une démonstration. Cela déplace simplement la question : il ne s’agit pas de savoir si l’on aime l’idée de Dieu, mais si l’on pense que ces hommes ont menti, se sont trompés, ou ont vu quelque chose."],
 versets:['1 Corinthiens 15.14-19','Luc 24.1-12','Actes 4.19-20']},

{id:6,cat:'La foi et le doute',q:"Pourquoi y a-t-il tant d’hypocrites dans les églises ?",
 court:"Parce que le christianisme ne prétend pas rassembler des gens meilleurs, mais des gens pardonnés. Et Jésus avait annoncé le mélange.",
 parabole:"Un hôpital plein de malades n’est pas un scandale, c’est sa fonction. Ce qui serait grave, ce serait un hôpital rempli de gens qui prétendent aller très bien.",
 dev:["Jésus a raconté la parabole du blé et de l’ivraie précisément pour dire ceci : dans le champ, les deux poussent ensemble, ils sont indiscernables avant maturité, et il est interdit de s’improviser trieur. L’Église mélangée n’est pas un accident, c’est annoncé.",
  "Il faut aussi distinguer deux choses très différentes. L’hypocrisie consciente, celle que Jésus dénonce avec une violence rare chez les religieux de son temps, mérite d’être nommée. Et l’incohérence ordinaire, celle de gens qui essaient et échouent, qui n’est pas de l’hypocrisie mais de la faiblesse.",
  "Il reste que l’argument ne prouve rien sur le fond. On ne juge pas un traitement sur ceux qui prétendent le suivre. La question de savoir si Jésus est ressuscité ne dépend pas du comportement de votre voisin de banc.",
  "Cela dit, l’objection garde une part de vérité qu’il ne faut pas escamoter : quand un chrétien blesse, le tort est réel, et l’Évangile lui demande de réparer, pas de s’expliquer."],
 versets:['Matthieu 13.24-30','Matthieu 23.27-28','1 Jean 1.8']},

{id:7,cat:'La Bible',q:"La Bible n’a-t-elle pas été modifiée au fil des siècles ?",
 court:"C’est le texte antique le mieux attesté qui existe. Les variantes sont nombreuses mais mineures, et aucune ne touche une doctrine.",
 parabole:"Si mille personnes recopient une même lettre à la main, il y aura mille petites fautes, différentes chez chacune. Justement pour cela, en comparant les mille copies, on peut reconstituer l’original avec une précision qu’on n’aurait pas avec une seule copie parfaite et invérifiable.",
 dev:["Les chiffres sont têtus. Pour le Nouveau Testament, on dispose d’environ 5 800 manuscrits grecs, plus 10 000 en latin et 9 000 dans d’autres langues anciennes. Le plus ancien fragment date d’environ 125 après Jésus-Christ, soit une trentaine d’années après la rédaction. À titre de comparaison, la Guerre des Gaules de César repose sur une dizaine de manuscrits, les plus anciens datant de neuf siècles après les faits.",
  "Les variantes existent bel et bien, environ 400 000, ce qui impressionne jusqu’à ce qu’on regarde de quoi il s’agit. La grande majorité sont des différences d’orthographe ou d’ordre des mots. Moins de 1 % modifient le sens, et les cas notables sont signalés en note dans toutes les bibles sérieuses, comme la fin longue de Marc ou la femme adultère en Jean 8.",
  "Pour l’Ancien Testament, la découverte des manuscrits de la mer Morte en 1947 a permis une vérification spectaculaire : le rouleau d’Ésaïe, mille ans plus ancien que les copies dont on disposait, s’est révélé quasiment identique.",
  "La question honnête n’est donc pas « le texte a-t-il été altéré », mais « le texte dit-il vrai ». C’est un tout autre débat, et il est plus intéressant."],
 versets:['2 Timothée 3.16','2 Pierre 1.20-21','Ésaïe 40.8']},

{id:8,cat:'La Bible',q:"Pourquoi les protestants ont-ils moins de livres que les catholiques ?",
 court:"Sept livres, dits deutérocanoniques, sont présents dans la Bible catholique et absents de la protestante. Le désaccord porte sur la liste juive de référence.",
 parabole:"Deux familles héritent des archives d’un ancêtre. L’une garde tout ce qui se trouvait dans le coffre. L’autre ne garde que ce que l’ancêtre avait lui-même rangé dans le tiroir marqué « officiel ». Aucune ne jette quoi que ce soit, mais elles ne classent pas pareil.",
 dev:["Les livres concernés sont Tobie, Judith, Sagesse, Siracide, Baruch, 1 et 2 Maccabées, plus des ajouts à Esther et Daniel. Ils figurent dans la Septante, la traduction grecque de l’Ancien Testament utilisée dans le monde antique.",
  "La position protestante s’appuie sur le canon hébraïque, celui que le judaïsme a retenu et que Jésus semble citer. Ces livres, écrits en grec ou conservés en grec, n’en font pas partie. Luther les a placés en annexe avec une mention nuancée : utiles à lire, non normatifs pour la doctrine.",
  "La position catholique, confirmée au concile de Trente en 1546, les considère comme pleinement inspirés, en s’appuyant sur l’usage constant de l’Église ancienne. Les orthodoxes en retiennent un nombre encore un peu différent.",
  "En pratique, l’enjeu est limité : aucune doctrine centrale ne repose exclusivement sur ces textes. Le débat le plus cité concerne la prière pour les morts, mentionnée en 2 Maccabées 12."],
 versets:['Luc 24.44','2 Timothée 3.16']},

{id:9,cat:'La Bible',q:"Par où commencer quand on n’a jamais lu la Bible ?",
 court:"Par l’Évangile selon Jean. Surtout pas par la Genèse, et surtout pas dans l’ordre.",
 parabole:"On ne fait pas visiter une ville en commençant par les fondations de la cathédrale. On monte d’abord sur un point haut pour comprendre la forme de l’ensemble, et ensuite on redescend dans les rues.",
 dev:["Jean est le meilleur point d’entrée pour trois raisons. Il annonce dès le premier chapitre qui est Jésus, au lieu de le faire deviner. Il explique les coutumes juives à mesure, signe qu’il écrivait pour des lecteurs extérieurs. Et il dit ouvertement son intention en 20.31 : que vous croyiez.",
  "Ensuite les Actes, qui racontent ce que cette histoire a produit dans les trente années suivantes. C’est le meilleur test de crédibilité disponible : que sont devenus les témoins.",
  "Puis Marc, plus court et plus nerveux, qui donne le récit à l’état brut. Puis Romains, plus exigeant, qui explique la logique de l’ensemble. Et seulement là, Genèse 1 à 11, que vous lirez complètement différemment.",
  "Deux conseils pratiques. Choisissez une traduction lisible, la Segond 21 ou la Bible du Semeur pour commencer, la Segond 1910 si vous aimez la langue classique. Et lisez un chapitre par jour au même moment, plutôt que trois heures un dimanche sur deux."],
 versets:['Jean 20.30-31','Luc 1.1-4']},

{id:10,cat:'Jésus',q:"Jésus a-t-il vraiment existé ?",
 court:"Oui, et cela ne fait pratiquement plus débat chez les historiens, y compris non croyants. Ce qui se discute, c’est qui il était.",
 parabole:"Personne ne conteste que Napoléon a existé parce que ses partisans ont écrit sur lui. On croise les sources, on regarde les traces indirectes, et on conclut.",
 dev:["Les sources non chrétiennes existent et sont anciennes. Tacite, historien romain, mentionne en 116 l’exécution du « Christ » sous Ponce Pilate. Flavius Josèphe, historien juif, le mentionne deux fois vers 93, dont un passage dont la partie centrale est probablement retouchée mais dont le noyau est considéré comme authentique. Suétone et Pline le Jeune y font également allusion.",
  "Les sources chrétiennes sont extrêmement précoces. Le credo cité par Paul en 1 Corinthiens 15.3-5 est daté par les spécialistes des trois à cinq années suivant la crucifixion, un délai qui interdit la formation d’une légende.",
  "L’historien Bart Ehrman, agnostique et critique du christianisme, écrit sans détour que la thèse de la non-existence de Jésus n’est défendue par aucun spécialiste sérieux du domaine.",
  "La vraie question n’est donc pas historique mais personnelle. C’est d’ailleurs celle que Jésus pose à ses disciples au milieu de Marc : « Et vous, qui dites-vous que je suis ? »"],
 versets:['Marc 8.27-29','1 Corinthiens 15.3-8']},

{id:11,cat:'Jésus',q:"Pourquoi fallait-il que Jésus meure ?",
 court:"Parce que le pardon a toujours un coût, et que quelqu’un doit le payer. La croix, c’est Dieu qui décide de le payer lui-même.",
 parabole:"Quelqu’un casse votre voiture. Vous pouvez lui faire un procès, ou lui dire « laisse tomber ». Dans les deux cas, la réparation sera payée. La différence est seulement de savoir par qui. Pardonner, c’est accepter d’absorber soi-même la dette.",
 dev:["Première chose à écarter : l’image d’un Dieu furieux qu’un Fils viendrait calmer. Le Nouveau Testament dit exactement l’inverse. « Dieu était en Christ, réconciliant le monde avec lui-même. » C’est le même Dieu des deux côtés de la croix, pas un juge d’un côté et une victime de l’autre.",
  "Deuxième point : la justice et le pardon semblent s’opposer, et la croix est le lieu où ils se rejoignent. Un juge qui acquitte un coupable sans plus n’est pas bon, il est corrompu. Le mal doit être traité comme du mal. À la croix, il l’est, et pourtant le coupable sort libre.",
  "Troisième point, celui que la Réforme a le plus travaillé : ce qu’on appelle le grand échange. Christ prend ce qui nous revient, nous recevons ce qui lui revient. Paul le formule sans nuance en 2 Corinthiens 5.21.",
  "Enfin, la croix dit quelque chose sur la valeur de la personne humaine. On mesure ce que vaut une chose au prix que quelqu’un accepte de payer pour elle. Ce prix a été payé pour des gens qui n’en demandaient pas tant."],
 versets:['2 Corinthiens 5.19-21','Romains 3.25-26','Ésaïe 53.5','1 Pierre 3.18']},

{id:12,cat:'Jésus',q:"Jésus a-t-il vraiment prétendu être Dieu ?",
 court:"Pas sous cette formule, mais par des gestes et des paroles qui, dans son contexte, ne laissaient aucune ambiguïté à ses auditeurs.",
 parabole:"Un homme entre dans un commissariat et commence à classer les dossiers, à donner des ordres et à signer les rapports. Il n’a pas besoin de dire « je suis le commissaire ». Tout le monde a compris, et cela va poser un problème.",
 dev:["Les revendications explicites existent, et elles sont graves dans un contexte juif. Il pardonne des péchés, ce que ses adversaires relèvent immédiatement comme réservé à Dieu seul. Il se dit maître du sabbat, une institution divine. Il accepte l’adoration, que tout Juif pieux aurait refusée avec horreur.",
  "La formule la plus forte se trouve en Jean 8.58 : « avant qu’Abraham fût, je suis ». Ce n’est pas une faute de grammaire, c’est le nom même que Dieu se donne en Exode 3.14. La réaction de l’auditoire est sans ambiguïté : ils ramassent des pierres.",
  "L’argument classique de C. S. Lewis reste utile : au vu de ce qu’il a dit de lui-même, Jésus ne peut pas être seulement un grand sage moral. Soit il mentait, soit il se trompait gravement, soit il disait vrai. La quatrième option confortable n’existe pas.",
  "Il faut ajouter que la formulation technique, deux natures en une seule personne, a demandé plusieurs siècles à l’Église pour être fixée, au concile de Chalcédoine en 451. Le contenu, lui, était là dès le début."],
 versets:['Jean 8.58','Marc 2.5-7','Jean 20.28','Philippiens 2.6-11']},

{id:13,cat:'La vie chrétienne',q:"Comment savoir si Dieu me parle ?",
 court:"Par quatre filtres qui se recoupent : l’Écriture, la paix intérieure durable, les circonstances, et le conseil de personnes matures.",
 parabole:"Un pilote ne se fie jamais à une seule sensation. Il a l’horizon artificiel, l’altimètre, la carte et la tour de contrôle. Quand les quatre concordent, il avance. Quand un seul dit autre chose, il vérifie avant de descendre.",
 dev:["Premier filtre, et il est éliminatoire : Dieu ne se contredit pas. Une impression contraire à ce que l’Écriture dit clairement n’est pas de lui, quelle qu’en soit l’intensité émotionnelle. C’est le critère le plus simple et le plus souvent négligé.",
  "Deuxième filtre, la paix. Non pas l’euphorie ni le soulagement immédiat, mais une paix qui tient dans la durée et qui résiste à l’examen. L’excitation retombe, la paix de Dieu reste.",
  "Troisième filtre, les circonstances. Elles ne suffisent jamais seules, parce qu’on leur fait dire ce qu’on veut, mais une porte qui s’ouvre trois fois de suite mérite d’être regardée.",
  "Quatrième filtre, la communauté. C’est celui que notre époque supporte le moins et dont on a le plus besoin. Proverbes revient dessus sans arrêt : le salut est dans le grand nombre de conseillers. Une conviction qu’on refuse de soumettre à qui que ce soit est presque toujours suspecte.",
  "Enfin, la voix de Dieu ne pousse pas à la précipitation. Si une décision exige d’être prise avant toute vérification, c’est déjà un signe."],
 versets:['Jean 10.27','Philippiens 4.6-7','Proverbes 11.14','1 Jean 4.1']},

{id:14,cat:'La vie chrétienne',q:"Pourquoi prier si Dieu sait déjà tout ?",
 court:"Parce que la prière ne sert pas à informer Dieu, mais à entrer en relation avec lui, et parce qu’il a choisi d’agir en réponse.",
 parabole:"Un enfant ne raconte pas sa journée à son père pour lui apprendre des faits que celui-ci connaît souvent déjà. Il la raconte parce que raconter ensemble, c’est ce qui fait la relation.",
 dev:["Jésus le dit explicitement : votre Père sait de quoi vous avez besoin avant que vous le lui demandiez. Et dans la même page, il enseigne à demander. Les deux tiennent ensemble, ce qui signifie que le but n’est pas l’information.",
  "La prière transforme d’abord celui qui prie. Formuler devant Dieu ce qu’on veut oblige à savoir ce qu’on veut, et souvent à s’apercevoir que ce n’est pas ce qu’on croyait. Beaucoup de prières se corrigent en cours de route.",
  "Mais la Bible affirme aussi, sans embarras, que Dieu agit en réponse à la prière. Jacques écrit que « vous ne possédez pas parce que vous ne demandez pas ». Dieu a choisi d’associer ses créatures à ce qu’il fait, comme un père qui pourrait tout porter mais qui demande de l’aide.",
  "Reste la prière non exaucée, qui est l’expérience la plus fréquente. Paul a demandé trois fois la même chose et a reçu un refus assorti d’une phrase : « ma grâce te suffit ». Il ne l’a pas trouvée satisfaisante sur le moment, il l’a trouvée vraie ensuite."],
 versets:['Matthieu 6.8','Jacques 4.2','2 Corinthiens 12.7-9','Luc 18.1-8']},

{id:15,cat:'La vie chrétienne',q:"Faut-il aller à l’église pour être chrétien ?",
 court:"Non pour être sauvé, oui pour tenir. La foi solitaire s’éteint presque toujours, et pas pour des raisons spirituelles mystérieuses.",
 parabole:"Un charbon retiré du foyer garde sa chaleur un moment. Personne ne l’éteint, personne ne lui en veut. Il refroidit simplement, parce que c’est ce qui arrive quand on est seul.",
 dev:["Le salut ne dépend pas de l’appartenance à une institution. Sur ce point, la Réforme est claire et le brigand sur la croix est le contre-exemple définitif : il n’a fréquenté aucune assemblée.",
  "Mais le mot traduit par Église, <em>ekklesia</em>, ne désigne pas un bâtiment : il désigne une assemblée convoquée. Le Nouveau Testament ne connaît pratiquement pas le chrétien isolé, et la trentaine de commandements « les uns les autres » qu’il contient sont tous inapplicables seul.",
  "L’argument le plus décisif est empirique. Ceux qui tiennent dix ou vingt ans sont presque toujours ceux qui ont été connus, repris, aidés, et à qui on a manqué quand ils n’étaient pas là. La foi n’est pas un fichier qu’on garde, c’est une pratique qui s’entretient.",
  "Cela dit, si la question vient d’une blessure d’église, elle mérite d’être entendue comme telle et non balayée. Beaucoup de gens ne fuient pas Dieu, ils fuient un souvenir précis. Chercher une autre communauté est légitime."],
 versets:['Hébreux 10.24-25','Actes 2.42-47','1 Corinthiens 12.12-27']},

{id:16,cat:'La vie chrétienne',q:"Je retombe toujours dans les mêmes choses, est-ce que Dieu se lasse ?",
 court:"Non. Le pardon de Dieu n’est pas un quota qui s’épuise, et la rechute n’annule pas l’adoption.",
 parabole:"Un enfant qui apprend à marcher tombe des centaines de fois. Aucun parent ne tient le compte, et aucun ne se demande à la quarantième chute s’il s’agit encore de son enfant.",
 dev:["Quand Pierre demande s’il faut pardonner jusqu’à sept fois, il se croit généreux : la coutume rabbinique de l’époque suggérait trois. La réponse de Jésus, soixante-dix fois sept fois, signifie simplement qu’on arrête de compter. Et c’est ce que Dieu demande à des humains, donc au minimum ce qu’il pratique.",
  "Il faut distinguer deux choses que la culpabilité confond. La position, qui est acquise : « il n’y a maintenant aucune condamnation pour ceux qui sont en Jésus-Christ ». Et la marche, qui progresse lentement, avec des allers-retours. Une mauvaise journée ne change pas la position.",
  "Distinguez aussi le remords, qui tourne en boucle sur soi et paralyse, et la repentance, qui se tourne vers Dieu et remet en mouvement. Paul appelle le premier « tristesse du monde » et dit qu’il produit la mort. Ce n’est pas une figure de style.",
  "Pratiquement : la rechute a presque toujours des conditions, une heure, une fatigue, une solitude, un écran. La grâce n’est pas une raison de ne rien changer aux conditions. Et si le cycle est installé, en parler à une personne de confiance fait plus que dix résolutions."],
 versets:['Matthieu 18.21-22','Romains 8.1','1 Jean 1.9','2 Corinthiens 7.10']},

{id:17,cat:'Les autres religions',q:"Toutes les religions ne mènent-elles pas au même but ?",
 court:"Elles se ressemblent sur la morale et divergent radicalement sur le diagnostic et le remède. Les traiter comme identiques, c’est ne prendre aucune au sérieux.",
 parabole:"Quatre médecins examinent le même patient. L’un dit que c’est une carence, l’autre une infection, le troisième que la maladie est une illusion, le quatrième qu’il faut une transplantation. Ils sont tous bienveillants. Ils ne disent pas la même chose, et le patient a intérêt à savoir lequel a raison.",
 dev:["L’image de la montagne aux multiples chemins est séduisante mais elle présuppose ce qu’elle veut prouver : que personne n’est arrivé au sommet et que l’on sait, depuis le bas, que tous les sentiers y mènent. C’est une affirmation religieuse de plus, pas un point de vue neutre.",
  "Les divergences sont structurelles, pas cosmétiques. Le bouddhisme classique ne pose pas de Dieu créateur et vise l’extinction du désir. L’hindouisme propose des voies multiples et une conception cyclique du temps. L’islam affirme un Dieu unique dont on est le serviteur, sans incarnation ni croix. Le judaïsme attend un Messie qui n’est pas venu. Le christianisme affirme que Dieu s’est fait homme et est mort. Ces propositions ne peuvent pas être vraies simultanément.",
  "Sur la morale, en revanche, les convergences sont réelles et significatives : presque toutes condamnent le meurtre, le vol, le mensonge, et valorisent la compassion. Le christianisme y voit une trace de la conscience donnée à tout être humain.",
  "La spécificité chrétienne tient en un renversement : partout ailleurs, l’homme monte vers Dieu par ses efforts. Ici, Dieu descend. Toutes les religions sont des systèmes d’ascension ; l’Évangile prétend être une descente."],
 versets:['Jean 14.6','Actes 4.12','Romains 2.14-15']},

{id:18,cat:'Les autres religions',q:"Que deviennent ceux qui n’ont jamais entendu parler de Jésus ?",
 court:"La Bible reste discrète, ce qui doit rendre prudent. Elle affirme deux choses : Dieu jugera avec justice, et personne ne sera condamné pour n’avoir pas su.",
 parabole:"Un juge que l’on sait absolument intègre traite un dossier dont on ne connaît pas les pièces. On peut ignorer le verdict tout en étant tranquille sur la manière dont il sera rendu.",
 dev:["Le point de départ est un principe posé par Abraham lui-même : « celui qui juge toute la terre n’exercera-t-il pas la justice ? » C’est une question rhétorique, et elle encadre tout le reste.",
  "Paul développe en Romains 1 et 2 que la création et la conscience rendent tout être humain responsable de ce qu’il pouvait savoir, ni plus ni moins. Le jugement porte sur la lumière reçue, non sur celle qui n’a jamais été donnée.",
  "Plusieurs positions coexistent chez les chrétiens, et l’honnêteté demande de le dire. Certains estiment que Dieu se révèle par d’autres moyens à ceux qui le cherchent sincèrement. D’autres soulignent les récits, nombreux dans les Actes, où Dieu prend l’initiative d’envoyer quelqu’un vers un chercheur, comme Corneille au chapitre 10.",
  "Ce que le texte ne permet pas, c’est de conclure à l’inutilité de la mission. La logique de Romains 10 est inverse : puisque l’annonce compte, allez. Et une remarque de bon sens : celui qui pose cette question a, lui, entendu."],
 versets:['Genèse 18.25','Romains 2.12-16','Actes 10','Romains 10.14-15']},

{id:19,cat:'Dieu et le mal',q:"L’enfer est-il compatible avec un Dieu d’amour ?",
 court:"La Bible le présente moins comme un châtiment infligé de l’extérieur que comme le respect définitif d’un refus.",
 parabole:"Une fête a lieu, la porte est ouverte, l’invitation a été portée à domicile. Certains n’entrent pas. À un moment, la fête commence. Forcer quelqu’un à entrer ne serait pas de l’amour, ce serait sa négation.",
 dev:["Premier constat gênant pour les caricatures : c’est Jésus qui parle le plus de l’enfer dans tout le Nouveau Testament, et toujours avec gravité, jamais avec satisfaction. On ne peut pas garder le Jésus doux en supprimant ces textes, ils viennent du même personnage.",
  "Le vocabulaire est imagé et varié : feu, ténèbres du dehors, destruction, séparation. Ces images ne se combinent pas littéralement, ce qui indique qu’elles décrivent une réalité par métaphores plutôt qu’un lieu par description. Le noyau commun est la séparation d’avec Dieu.",
  "C. S. Lewis a proposé une formule souvent reprise : les portes de l’enfer sont verrouillées de l’intérieur. Dans cette lecture, Dieu ne jette personne dehors ; il ratifie une orientation prise et maintenue.",
  "Il faut enfin reconnaître que des chrétiens sérieux divergent sur la durée et la nature de cet état. Le texte biblique laisse une marge, et l’humilité est de mise. Ce que le Nouveau Testament ne laisse pas dans le flou, c’est l’urgence de l’invitation."],
 versets:['Matthieu 25.31-46','2 Thessaloniciens 1.9','Luc 13.34','2 Pierre 3.9']},

{id:20,cat:'La vie chrétienne',q:"Comment pardonner à quelqu’un qui ne le mérite pas ?",
 court:"En distinguant le pardon, qui est une décision unilatérale, de la réconciliation, qui exige deux personnes et de la confiance reconstruite.",
 parabole:"Vous portez un sac de pierres depuis des années parce que quelqu’un vous l’a mis sur le dos. Le poser ne signifie pas dire que le geste était acceptable. Cela signifie refuser de le porter à sa place pour le restant de vos jours.",
 dev:["La confusion la plus destructrice consiste à croire que pardonner voudrait dire minimiser, oublier, ou reprendre la relation comme avant. Rien de tout cela n’est exigé. Pardonner, c’est renoncer à obtenir soi-même réparation, pas déclarer que le mal n’était pas grave.",
  "La distinction avec la réconciliation est essentielle et libère beaucoup de gens. Le pardon ne dépend que de vous. La réconciliation dépend aussi de l’autre, de sa reconnaissance des faits, et d’une confiance qui se reconstruit lentement, parfois jamais. Vous pouvez pardonner à quelqu’un et ne plus jamais lui ouvrir votre porte.",
  "Le fondement chrétien n’est pas la force morale mais la comparaison. La parabole du serviteur impitoyable met en regard une dette astronomique remise et une dette dérisoire réclamée. Le pardon reçu précède et rend possible le pardon donné.",
  "En pratique, le pardon est rarement un instant, plutôt une décision à reprendre. Il est normal de devoir la refaire quand le souvenir revient. Ce n’est pas un échec, c’est le rythme normal."],
 versets:['Matthieu 18.21-35','Éphésiens 4.31-32','Romains 12.19','Colossiens 3.13']}
];

window.LECONS={
'UBE01':{
 titre:"Épître de Jacques",
 objectifs:["Situer Jacques dans le judéo-christianisme du premier siècle","Dégager la structure réelle d'un texte qui paraît décousu","Articuler correctement Jacques 2 et Éphésiens 2","Identifier cinq applications directes dans la vie de l'assemblée"],
 parabole:"Un homme achète un abonnement de salle de sport. Il a la carte, il connaît les machines, il parle de musculation avec compétence. Au bout d'un an, personne ne voit de différence, parce qu'il n'est jamais entré. Sa carte n'est pas fausse. Elle n'a simplement jamais servi à rien.",
 corps:[
  {h:"Situation du livre",p:["Jacques est très probablement le demi-frère de Jésus, celui qui ne croyait pas de son vivant (Jean 7.5) et qui devient après la résurrection le responsable de l'église de Jérusalem (Actes 15). Ce détail biographique n'est pas anecdotique : personne n'a plus de raisons de connaître le contraste entre parler de Jésus et le suivre.",
   "La lettre s'adresse « aux douze tribus qui sont dans la dispersion », donc à des chrétiens d'origine juive éparpillés par la persécution. Elle est probablement le plus ancien écrit du Nouveau Testament, vers 45 à 48, avant même le concile de Jérusalem.",
   "Le genre littéraire explique l'impression de désordre : c'est de la <em>parénèse</em>, une suite d'exhortations dans la tradition sapientielle juive, proche des Proverbes. On y compte plus de cinquante impératifs en cent huit versets. Ce n'est pas un traité, c'est une prédication mise par écrit."]},
  {h:"Structure",p:["Sous l'apparent décousu, un thème unique tient tout : <strong>la foi authentique se vérifie</strong>. Cinq domaines de vérification se succèdent, et chacun revient plusieurs fois, comme des motifs musicaux.",
   "1. L'épreuve (1.2-18) : ce qui révèle. 2. La Parole (1.19-27) : entendre ou pratiquer. 3. Le favoritisme (2.1-13) : la foi face aux différences sociales. 4. Les œuvres (2.14-26) : le cœur du débat. 5. La langue (3.1-12), la sagesse (3.13-18), l'argent et la patience (4 et 5).",
   "Astuce de lecture : chaque fois que Jacques emploie « mes frères », il ouvre une nouvelle unité. Repérer ces quinze occurrences donne le plan du livre sans commentaire."]},
  {h:"Le point difficile : Jacques 2 et la justification",p:["« L'homme est justifié par les œuvres, et non par la foi seulement » (2.24). Luther a appelé cette lettre une « épître de paille ». Le conflit avec Paul est-il réel ?",
   "Non, et pour une raison de vocabulaire. Les deux hommes emploient les mêmes mots dans des sens différents. Pour Paul, <em>justifier</em> signifie déclarer juste devant Dieu ; pour Jacques, démontrer qu'on est juste devant les hommes. Pour Paul, la <em>foi</em> est la confiance qui s'attache à Christ ; pour Jacques, c'est une adhésion intellectuelle, celle que les démons possèdent aussi (2.19). Pour Paul, les <em>œuvres</em> sont les efforts de la Loi accomplis pour être sauvé ; pour Jacques, ce sont les fruits qui suivent le salut.",
   "Ils citent d'ailleurs le même exemple, Abraham, mais à deux moments différents : Paul en Genèse 15, quand Abraham croit, Jacques en Genèse 22, quand cette foi se prouve trente ans plus tard. Formule de synthèse : <strong>la foi seule sauve, mais la foi qui sauve n'est jamais seule.</strong>"]},
  {h:"Application",p:["Jacques est le livre le plus immédiatement praticable du Nouveau Testament, et le plus inconfortable. Trois tests concrets qu'il propose : la manière dont votre assemblée accueille quelqu'un de mal habillé (2.2-4), ce que vous faites de vos vingt dernières paroles (3.2-10), et si vous priez pour les malades ou seulement pour les projets (5.14-16).",
   "Un dernier point souvent négligé : Jacques 4.17 définit le péché non par ce qu'on fait de mal, mais par le bien qu'on savait faire et qu'on n'a pas fait. Cela déplace considérablement l'examen de conscience."]}],
 verset:"« Mettez en pratique la parole, et ne vous bornez pas à l’écouter, en vous trompant vous-mêmes par de faux raisonnements. »",
 vref:"Jacques 1.22 · Segond",
 lectures:["Jacques 1 à 5, deux fois, dont une d’une traite","Genèse 15 et 22","Romains 4 et Éphésiens 2.8-10"],
 travail:"Rédiger deux pages sur l’articulation entre Jacques 2.24 et Éphésiens 2.8-9, en définissant précisément les trois termes foi, œuvres et justification chez chaque auteur."},

'UBD01':{
 titre:"Six Doctrines",
 objectifs:["Identifier les six fondements listés en Hébreux 6.1-2","Distinguer ce qui est fondement et ce qui est construction","Savoir exposer chacun des six points en cinq minutes","Repérer les déséquilibres doctrinaux courants"],
 parabole:"Un maçon montre à un apprenti les fondations d'une maison presque achevée. L'apprenti trouve cela sans intérêt : c'est enterré, ce n'est pas beau, on ne le verra jamais. Le maçon lui répond que c'est exactement le but. Une fondation ne se remarque que le jour où elle manque, et ce jour-là il est trop tard.",
 corps:[
  {h:"Le texte de base",p:["Hébreux 6.1-2 énumère ce que l'auteur appelle « les premiers principes de la parole de Christ », littéralement le commencement de la doctrine. Il en donne six, groupés deux par deux : la repentance et la foi, les baptêmes et l'imposition des mains, la résurrection des morts et le jugement éternel.",
   "Détail décisif du contexte : l'auteur ne dit pas de s'y attarder, il dit de « tendre à ce qui est parfait », c'est-à-dire de dépasser ce stade. Ces six points ne sont pas le programme d'une vie chrétienne, ils en sont la condition d'entrée. Une église qui les réenseigne indéfiniment est une église qui n'a jamais quitté le chantier des fondations."]},
  {h:"1 et 2 : la repentance et la foi",p:["La <em>repentance</em> (metanoia) n'est pas le remords, qui regarde en arrière et paralyse ; c'est un changement de direction. Paul distingue nettement les deux en 2 Corinthiens 7.10 : la tristesse selon Dieu produit la repentance, la tristesse du monde produit la mort.",
   "La <em>foi en Dieu</em> (pistis) est le mouvement complémentaire : on se détourne de quelque chose pour se tourner vers quelqu'un. Les deux sont indissociables, c'est le même demi-tour vu de dos et de face. Une repentance sans foi produit du légalisme, une foi sans repentance produit une religion de confort."]},
  {h:"3 et 4 : les baptêmes et l’imposition des mains",p:["Le pluriel « baptêmes » surprend et il est intentionnel. Le Nouveau Testament en connaît plusieurs : celui de Jean, de repentance ; celui d'eau, au nom de Jésus-Christ ; celui du Saint-Esprit ; et le baptême en un seul corps de 1 Corinthiens 12.13. Les traditions divergent sur leur articulation, et il faut savoir présenter honnêtement les positions.",
   "L'<em>imposition des mains</em> apparaît pour la bénédiction, la guérison, la réception de l'Esprit et la reconnaissance d'un ministère. Elle ne confère rien magiquement : elle exprime publiquement une association et une transmission. 1 Timothée 5.22 met d'ailleurs en garde contre la précipitation en la matière."]},
  {h:"5 et 6 : la résurrection et le jugement",p:["La <em>résurrection des morts</em> concerne le corps, non l'âme seule. C'est le point de rupture avec le platonisme, et c'est ce qui rendait Paul risible à Athènes (Actes 17.32). L'espérance chrétienne n'est pas de s'échapper du corps mais d'en recevoir un nouveau (1 Corinthiens 15.42-44).",
   "Le <em>jugement éternel</em> clôt la liste, et il est étonnant de le trouver dans les fondations. La raison est simple : sans horizon de jugement, ni la repentance ni la foi n'ont d'urgence. Il faut cependant l'enseigner tel que le Nouveau Testament le présente, avec gravité et sans complaisance dans la menace."]}],
 verset:"« C’est pourquoi, laissant les éléments de la parole de Christ, tendons à ce qui est parfait, sans poser de nouveau le fondement... »",
 vref:"Hébreux 6.1 · Segond",
 lectures:["Hébreux 5.11 à 6.12","Actes 2.36-42 et 19.1-7","1 Corinthiens 15.12-58"],
 travail:"Préparer un exposé de cinq minutes sur chacun des six points, à destination d’une personne qui vient de croire, sans employer un seul mot de vocabulaire religieux non expliqué."},

'UBD03':{
 titre:"Herméneutique",
 objectifs:["Distinguer exégèse, herméneutique et homilétique","Appliquer la règle du contexte à trois niveaux","Identifier le genre littéraire et ses règles propres","Passer du sens d'origine à l'application sans le trahir"],
 parabole:"Un randonneur trouve une carte au fond d'un refuge. Elle est exacte, détaillée, magnifique. Il l'utilise pendant deux heures avant de comprendre qu'elle représente une autre vallée. Le problème n'était pas la carte, ni sa bonne volonté. Il n'avait pas vérifié de quoi elle parlait avant de s'en servir.",
 corps:[
  {h:"Trois mots à ne pas confondre",p:["L'<em>exégèse</em> demande : que disait ce texte à ses premiers destinataires ? L'<em>herméneutique</em> demande : selon quelles règles passe-t-on de ce sens-là à aujourd'hui ? L'<em>homilétique</em> demande : comment le communiquer ? Sauter la première étape est l'erreur la plus fréquente, et la plus coûteuse.",
   "Le principe directeur est celui de la Réforme : l'Écriture s'interprète par l'Écriture, et son sens est en principe accessible à tout croyant sérieux, ce qu'on appelle la clarté ou perspicuité. Cela n'exclut pas le travail, cela exclut le monopole."]},
  {h:"La règle du contexte, à trois niveaux",p:["<strong>Contexte immédiat</strong> : les versets qui précèdent et qui suivent. Philippiens 4.13, « je puis tout par celui qui me fortifie », ne parle pas de réussite mais de savoir vivre dans l'abondance comme dans la privation, ce que dit le verset 12.",
   "<strong>Contexte du livre</strong> : le propos d'ensemble et le destinataire. Jérémie 29.11 est adressé à des déportés à qui Dieu vient d'annoncer soixante-dix ans d'exil. Ce n'est pas une promesse de confort rapide.",
   "<strong>Contexte canonique</strong> : la place dans l'histoire du salut. Une prescription du Lévitique ne s'applique pas telle quelle après la croix, et Hébreux explique précisément pourquoi."]},
  {h:"Le genre littéraire",p:["Chaque genre a ses règles. Le <em>récit</em> décrit ce qui s'est passé, il ne prescrit pas nécessairement : Jacob a eu quatre femmes, ce n'est pas un modèle. La <em>poésie</em> use d'hyperboles et de parallélismes, et prendre un psaume au pied de la lettre produit des contresens.",
   "La <em>prophétie</em> a souvent un accomplissement immédiat et un accomplissement ultérieur. La <em>parabole</em> vise un point principal, et vouloir allégoriser chaque détail est la faute classique. L'<em>apocalyptique</em> parle par images codées à des lecteurs persécutés : l'Apocalypse est un livre de consolation, pas un calendrier.",
   "L'<em>épître</em> est une lettre de circonstance, ce qui oblige à reconstituer la situation à laquelle elle répond avant d'en tirer une règle universelle."]},
  {h:"Du sens à l’application",p:["La méthode la plus sûre tient en trois questions. Que disait le texte à eux ? Quel principe intemporel s'en dégage ? À quoi cela correspond-il chez nous ?",
   "Le passage direct de la première à la troisième question, en sautant le principe, est la source de la plupart des abus de la Bible. Inversement, un principe formulé de façon si générale qu'il ne coûte rien est le signe qu'on a désamorcé le texte.",
   "Deux garde-fous pratiques : ne jamais fonder une doctrine sur un seul verset, et se méfier d'une interprétation que personne n'avait vue depuis deux mille ans."]}],
 verset:"« Efforce-toi de te présenter devant Dieu comme un homme éprouvé, un ouvrier qui n’a point à rougir, qui dispense droitement la parole de la vérité. »",
 vref:"2 Timothée 2.15 · Segond",
 lectures:["2 Timothée 2.14-19","Néhémie 8.1-8","Actes 8.26-35 et 17.10-12"],
 travail:"Prendre trois versets couramment cités hors contexte (Philippiens 4.13, Jérémie 29.11, Matthieu 18.20) et rédiger pour chacun l’exégèse, le principe, puis l’application légitime."}
};
